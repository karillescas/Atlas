<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de equipos TI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* Colores y tipografía de la aplicación */
:root {
  --bg: #EDF0F1;
  --panel: #FFFFFF;
  --ink: #16252D;
  --muted: #5B6B73;
  --line: #CBD3D7;
  --accent: #0E5A73;
  --accent-soft: #DCEBF0;
  --on-accent: #FFFFFF;
  --rail: #1E3440;
  --rail-ink: #E4EAEC;
  --rail-muted: #9FB2BB;
  --signal: #E3B23C;
  --danger: #B3261E;
  --danger-soft: #F9E1DF;

  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color: var(--ink);
  font-size: 16px;
  line-height: 1.45;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111A1E; --panel: #182329; --ink: #E4EAEC; --muted: #93A3AA; --line: #2E3B42;
    --accent: #5AAECB; --accent-soft: #1D3A46; --on-accent: #0B1A20;
    --rail: #0B1317; --rail-ink: #E4EAEC; --rail-muted: #7F939C;
    --danger: #F2867D; --danger-soft: #3A1F1D;
  }
}
:root[data-theme="dark"] {
  --bg: #111A1E; --panel: #182329; --ink: #E4EAEC; --muted: #93A3AA; --line: #2E3B42;
  --accent: #5AAECB; --accent-soft: #1D3A46; --on-accent: #0B1A20;
  --rail: #0B1317; --rail-ink: #E4EAEC; --rail-muted: #7F939C;
  --danger: #F2867D; --danger-soft: #3A1F1D;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { height: 100%; margin: 0; background: var(--bg); }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Botones y campos ---------- */
.btn {
  display: inline-flex; align-items: center; gap: .4rem;
  border: 1px solid transparent; border-radius: 6px;
  padding: .55rem 1rem; cursor: pointer; font-weight: 600;
  background: var(--accent); color: var(--on-accent);
}
.btn:disabled { opacity: .55; cursor: progress; }
.btn-sec { background: transparent; color: var(--ink); border-color: var(--line); }
.btn-link { background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; }
.campo { display: flex; flex-direction: column; gap: .3rem; margin-bottom: 1rem; }
.campo label, .campo legend { font-size: .85rem; font-weight: 600; }
.campo .ayuda { font-size: .8rem; color: var(--muted); }
.campo .error { font-size: .8rem; color: var(--danger); }
input[type=text], input[type=email], input[type=number], input[type=password], input[type=search], select, textarea {
  width: 100%; padding: .55rem .7rem; border: 1px solid var(--line);
  border-radius: 6px; background: var(--panel);
}
input[readonly] { background: var(--bg); color: var(--muted); }
textarea { min-height: 5.5rem; resize: vertical; }
.campo.invalido input, .campo.invalido select, .campo.invalido textarea { border-color: var(--danger); }
fieldset.campo { border: 1px solid var(--line); border-radius: 6px; padding: .7rem .9rem; }
.opcion { display: flex; gap: .55rem; align-items: flex-start; padding: .3rem 0; font-size: .92rem; }
.opcion input { margin-top: .25rem; }
.opcion small { display: block; color: var(--muted); }

/* ---------- Login ---------- */
.login { min-height: 100%; display: grid; place-items: center; padding: 1.5rem; }
.login-card {
  width: min(380px, 100%); background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 2rem;
}
.login-card h1 { font-stretch: 80%; font-size: 1.75rem; line-height: 1.1; margin: 0 0 .35rem; }
.login-card p { color: var(--muted); margin: 0 0 1.5rem; }
.aviso { background: var(--danger-soft); color: var(--danger); border-radius: 6px; padding: .7rem .9rem; font-size: .9rem; margin-bottom: 1rem; }

/* ---------- Estructura ---------- */
.app { display: grid; grid-template-columns: 250px 1fr; height: 100%; }
.rail { background: var(--rail); color: var(--rail-ink); display: flex; flex-direction: column; min-height: 0; }
.marca-app { padding: 1.4rem 1.25rem 1rem; }
.marca-app strong { display: block; font-stretch: 78%; font-size: 1.35rem; line-height: 1.1; }
.marca-app span { color: var(--rail-muted); font-size: .85rem; }
.rail nav { display: flex; flex-direction: column; padding: .5rem 0; flex: 1; }
.nav-item {
  display: flex; justify-content: space-between; align-items: baseline;
  background: none; border: none; border-left: 4px solid transparent;
  color: var(--rail-ink); padding: .65rem 1.25rem .65rem 1rem; cursor: pointer; text-align: left;
}
.nav-item:hover { background: rgba(255,255,255,.05); }
.nav-item[aria-current="page"] { border-left-color: var(--signal); background: rgba(255,255,255,.08); font-weight: 600; }
.nav-item .cuenta { color: var(--rail-muted); font-variant-numeric: tabular-nums; font-size: .85rem; }
.rail-pie { padding: 1rem 1.25rem; border-top: 1px solid rgba(255,255,255,.1); font-size: .85rem; }
.rail-pie .rol { color: var(--rail-muted); display: block; margin-bottom: .5rem; }
.rail-pie button { background: none; border: 1px solid rgba(255,255,255,.25); color: var(--rail-ink); border-radius: 6px; padding: .35rem .8rem; cursor: pointer; }

main { overflow-y: auto; padding: 2rem clamp(1rem, 3vw, 2.5rem); min-width: 0; }
.encabezado { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
.encabezado h1 { margin: 0; font-stretch: 78%; font-size: clamp(1.9rem, 3.5vw, 2.6rem); line-height: 1; }
.encabezado p { margin: .45rem 0 0; color: var(--muted); max-width: 60ch; }
.barra { display: flex; gap: .6rem; flex-wrap: wrap; margin-bottom: 1rem; }
.barra input[type=search] { flex: 1 1 260px; }
.barra select { flex: 0 0 auto; width: auto; }
.nota { font-size: .88rem; color: var(--muted); margin: 0 0 1rem; }

.tabla-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th { text-align: left; font-size: .8rem; font-weight: 600; color: var(--muted); padding: .7rem .9rem; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--panel); }
td { padding: .65rem .9rem; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: none; }
tbody tr.editable { cursor: pointer; }
tbody tr.editable:hover td { background: var(--accent-soft); }
tr.inactivo td { color: var(--muted); }
.mono { font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.chip { display: inline-block; font-size: .78rem; padding: .1rem .5rem; border-radius: 4px; background: var(--accent-soft); color: var(--ink); white-space: nowrap; }
.chip-inactivo { background: var(--signal); color: #2A2106; }
.vacio { padding: 3rem 1.5rem; text-align: center; color: var(--muted); }
.vacio .btn { margin-top: 1rem; }

/* ---------- Panel lateral de edición ---------- */
dialog.panel {
  margin: 0 0 0 auto; height: 100%; max-height: 100%; width: min(480px, 100%);
  border: none; padding: 0; background: var(--panel); color: var(--ink);
  border-left: 1px solid var(--line);
}
dialog.panel::backdrop { background: rgba(8, 18, 22, .45); }
dialog.panel form { display: flex; flex-direction: column; height: 100%; }
.panel-cab { padding: calc(1.25rem + env(safe-area-inset-top, 0px)) 1.5rem 1rem; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.panel-cab h2 { margin: 0; font-stretch: 85%; font-size: 1.4rem; }
.panel-cuerpo { padding: 1.25rem 1.5rem; overflow-y: auto; flex: 1; }
.panel-pie { padding: 1rem 1.5rem calc(1rem + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: .6rem; }
.cerrar { background: none; border: none; font-size: 1.5rem; line-height: 1; cursor: pointer; color: var(--muted); padding: .2rem .4rem; }

.toast {
  position: fixed; left: 50%; bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: .7rem 1.2rem; border-radius: 6px; font-size: .92rem; z-index: 10; max-width: calc(100% - 2rem);
}
.toast.error { background: var(--danger); color: #fff; }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .rail { flex-direction: row; align-items: stretch; overflow-x: auto; }
  .marca-app { display: none; }
  .rail nav { flex-direction: row; padding: 0; }
  .nav-item { border-left: none; border-bottom: 4px solid transparent; padding: .8rem 1rem; gap: .5rem; white-space: nowrap; }
  .nav-item[aria-current="page"] { border-bottom-color: var(--signal); }
  .rail-pie { border-top: none; display: flex; align-items: center; gap: .6rem; padding: .5rem 1rem; }
  .rail-pie .rol { display: none; }
  main { padding: 1.25rem 1rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<section class="login" id="vistaLogin" hidden>
  <div class="login-card">
    <h1>Control de equipos TI</h1>
    <p>Inicia sesión con tu cuenta de Sistemas.</p>
    <div class="aviso" id="loginAviso" hidden></div>
    <form id="formLogin" novalidate>
      <div class="campo">
        <label for="loginEmail">Correo</label>
        <input type="email" id="loginEmail" autocomplete="username" required>
      </div>
      <div class="campo">
        <label for="loginPass">Contraseña</label>
        <input type="password" id="loginPass" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit" id="btnEntrar" style="width:100%;justify-content:center">Entrar</button>
    </form>
    <p style="margin:1rem 0 0;font-size:.88rem">
      <button class="btn-link" type="button" id="btnRecuperar">Olvidé mi contraseña</button>
    </p>
  </div>
</section>

<!-- ================= APP ================= -->
<div class="app" id="vistaApp" hidden>
  <aside class="rail">
    <div class="marca-app">
      <strong>Control de equipos TI</strong>
      <span>Configuración</span>
    </div>
    <nav id="nav" aria-label="Catálogos"></nav>
    <div class="rail-pie">
      <span class="rol" id="quienSoy"></span>
      <button type="button" id="btnSalir">Cerrar sesión</button>
    </div>
  </aside>

  <main>
    <div class="encabezado">
      <div>
        <h1 id="titulo"></h1>
        <p id="descripcion"></p>
      </div>
      <button class="btn" type="button" id="btnNuevo"></button>
    </div>
    <div class="barra">
      <input type="search" id="buscar" placeholder="Buscar" aria-label="Buscar en el catálogo">
      <select id="filtroEstado" aria-label="Filtrar por estado">
        <option value="activos">Activos</option>
        <option value="inactivos">Inactivos</option>
        <option value="todos">Todos</option>
      </select>
    </div>
    <p class="nota" id="nota" hidden></p>
    <div class="tabla-wrap" id="tablaWrap"></div>
  </main>
</div>

<!-- ================= PANEL DE EDICIÓN ================= -->
<dialog class="panel" id="panel" aria-labelledby="panelTitulo">
  <form id="formRegistro" novalidate>
    <div class="panel-cab">
      <h2 id="panelTitulo"></h2>
      <button type="button" class="cerrar" id="btnCerrar" aria-label="Cerrar">×</button>
    </div>
    <div class="panel-cuerpo" id="panelCampos"></div>
    <div class="panel-pie">
      <button type="button" class="btn btn-sec" id="btnCancelar">Cancelar</button>
      <button type="submit" class="btn" id="btnGuardar">Guardar</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
/* =========================================================
   1. CONEXIÓN — pega aquí los datos de tu proyecto Supabase
      (Project Settings > API > Project URL y anon public key)
   ========================================================= */
const SUPABASE_URL = 'https://yoalzgvfpshdverbgors.supabase.co';
const SUPABASE_ANON_KEY = 'T1Xfo0hfV1k14uXs2xDa';

const configurado = !SUPABASE_URL.includes('TU-PROYECTO');
const sb = configurado ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* =========================================================
   2. DEFINICIÓN DE CATÁLOGOS
      Cada catálogo describe su tabla, columnas y campos.
      Para agregar uno nuevo (ej. centros de costo) basta
      con añadir una entrada aquí.
   ========================================================= */
const RFC_RE = /^[A-ZÑ&]{3,4}[0-9]{6}[A-Z0-9]{3}$/;

const REGIMENES = [
  ['601', '601 · General de Ley Personas Morales'],
  ['603', '603 · Personas Morales con Fines no Lucrativos'],
  ['606', '606 · Arrendamiento'],
  ['612', '612 · Personas Físicas con Actividades Empresariales y Profesionales'],
  ['616', '616 · Sin obligaciones fiscales'],
  ['621', '621 · Incorporación Fiscal'],
  ['625', '625 · Plataformas Tecnológicas'],
  ['626', '626 · Régimen Simplificado de Confianza'],
];

const CONTROLES = {
  SERIE:    { etiqueta: 'Por número de serie', ayuda: 'Cada pieza se registra y se resguarda individualmente (laptop, monitor).' },
  IMEI:     { etiqueta: 'Por serie e IMEI',    ayuda: 'Igual que por serie, además exige IMEI (celular, módem).' },
  CANTIDAD: { etiqueta: 'Por cantidad',        ayuda: 'Se maneja como existencia, sin identificar piezas (tóner, teclado).' },
};
const controlDe = r => r.requiere_imei ? 'IMEI' : (r.requiere_serie ? 'SERIE' : 'CANTIDAD');

const specsATexto = o => Object.entries(o || {}).map(([k, v]) => `${k}: ${v}`).join('\n');
const textoASpecs = t => {
  const o = {};
  (t || '').split('\n').forEach(l => {
    const i = l.indexOf(':');
    if (i > 0) { const k = l.slice(0, i).trim(); const v = l.slice(i + 1).trim(); if (k) o[k] = v; }
  });
  return o;
};

const CATALOGOS = {
  proveedores: {
    titulo: 'Proveedores', singular: 'proveedor', nuevo: 'Nuevo proveedor',
    descripcion: 'El RFC se usa para reconocer al emisor cuando cargues facturas en XML.',
    tabla: 'proveedores', select: '*', orden: 'razon_social',
    columnas: [
      { t: 'RFC', v: r => r.rfc, clase: 'mono' },
      { t: 'Razón social', v: r => r.razon_social },
      { t: 'Nombre comercial', v: r => r.nombre_comercial },
      { t: 'Contacto', v: r => [r.contacto_nombre, r.telefono].filter(Boolean).join(', ') },
      { t: 'Crédito', v: r => r.dias_credito ? `${r.dias_credito} días` : 'Contado' },
    ],
    campos: [
      { k: 'rfc', t: 'RFC', req: true, mayus: true, patron: RFC_RE, msgPatron: 'Formato de RFC no válido.', ayuda: '12 caracteres para persona moral, 13 para persona física. Extranjeros: XEXX010101000.' },
      { k: 'razon_social', t: 'Razón social', req: true, mayus: true, ayuda: 'Tal como aparece en la constancia fiscal, sin régimen societario.' },
      { k: 'nombre_comercial', t: 'Nombre comercial' },
      { k: 'regimen_fiscal', t: 'Régimen fiscal', tipo: 'select', opciones: () => REGIMENES },
      { k: 'codigo_postal', t: 'Código postal fiscal', patron: /^\d{5}$/, msgPatron: 'Deben ser 5 dígitos.' },
      { k: 'contacto_nombre', t: 'Nombre de contacto' },
      { k: 'telefono', t: 'Teléfono' },
      { k: 'email', t: 'Correo', tipo: 'email' },
      { k: 'dias_credito', t: 'Días de crédito', tipo: 'number', ayuda: '0 si es de contado.' },
      { k: 'notas', t: 'Notas', tipo: 'textarea' },
    ],
  },

  tipos: {
    titulo: 'Tipos de equipo', singular: 'tipo', nuevo: 'Nuevo tipo',
    descripcion: 'El tipo define si un equipo se controla pieza por pieza o por cantidad, y si requiere resguardo.',
    tabla: 'tipos_equipo', select: '*', orden: 'nombre',
    columnas: [
      { t: 'Clave', v: r => r.clave, clase: 'mono' },
      { t: 'Nombre', v: r => r.nombre },
      { t: 'Control', v: r => CONTROLES[controlDe(r)].etiqueta, chip: true },
      { t: 'Resguardo', v: r => r.requiere_resguardo ? 'Sí' : 'No' },
      { t: 'Vida útil', v: r => r.vida_util_meses ? `${r.vida_util_meses} meses` : '' },
    ],
    campos: [
      { k: 'clave', t: 'Clave', req: true, mayus: true, patron: /^[A-Z0-9_]{2,20}$/, msgPatron: 'Solo letras, números y guion bajo, sin espacios.', ayuda: 'Identificador corto, ej. LAPTOP.' },
      { k: 'nombre', t: 'Nombre', req: true },
      { k: '_control', t: 'Cómo se controla', tipo: 'control' },
      { k: 'requiere_resguardo', t: 'Genera resguardo al asignarse', tipo: 'check' },
      { k: 'vida_util_meses', t: 'Vida útil (meses)', tipo: 'number', ayuda: 'Opcional. Servirá para avisar de equipos por renovar.' },
    ],
  },

  marcas: {
    titulo: 'Marcas', singular: 'marca', nuevo: 'Nueva marca',
    descripcion: 'Fabricantes de los equipos y suministros.',
    tabla: 'marcas', select: '*', orden: 'nombre',
    columnas: [{ t: 'Nombre', v: r => r.nombre }],
    campos: [{ k: 'nombre', t: 'Nombre', req: true }],
  },

  modelos: {
    titulo: 'Modelos', singular: 'modelo', nuevo: 'Nuevo modelo',
    descripcion: 'Cada modelo pertenece a una marca y a un tipo, ej. Dell Latitude 5440 es una laptop.',
    tabla: 'modelos', select: '*, marcas(nombre), tipos_equipo(nombre)', orden: 'nombre',
    columnas: [
      { t: 'Marca', v: r => r.marcas?.nombre },
      { t: 'Modelo', v: r => r.nombre },
      { t: 'Tipo', v: r => r.tipos_equipo?.nombre, chip: true },
      { t: 'No. de parte', v: r => r.numero_parte, clase: 'mono' },
      { t: 'Especificaciones', v: r => Object.values(r.especificaciones || {}).join(', ') },
    ],
    campos: [
      { k: 'marca_id', t: 'Marca', req: true, tipo: 'select', num: true, opciones: () => aux.marcas.map(m => [m.id, m.nombre]) },
      { k: 'tipo_id', t: 'Tipo de equipo', req: true, tipo: 'select', num: true, opciones: () => aux.tipos.map(x => [x.id, x.nombre]) },
      { k: 'nombre', t: 'Modelo', req: true, ayuda: 'Sin repetir la marca, ej. Latitude 5440.' },
      { k: 'numero_parte', t: 'Número de parte' },
      { k: 'especificaciones', t: 'Especificaciones', tipo: 'specs', ayuda: 'Una por línea, en formato clave: valor. Ej. ram: 16 GB' },
    ],
  },

  usuarios: {
    titulo: 'Usuarios del sistema', singular: 'usuario', nuevo: null, soloAdmin: true,
    descripcion: 'Personas que pueden entrar a esta aplicación. Quienes reciben equipos en resguardo se darán de alta en Colaboradores.',
    nota: 'Para agregar a alguien, invítalo desde Supabase en Authentication > Users. Aparecerá aquí como inactivo con rol Consulta; ábrelo para activarlo y asignarle su rol.',
    tabla: 'usuarios', select: '*', orden: 'nombre',
    columnas: [
      { t: 'Nombre', v: r => r.nombre },
      { t: 'Correo', v: r => r.email },
      { t: 'Rol', v: r => ROLES[r.rol], chip: true },
    ],
    campos: [
      { k: 'nombre', t: 'Nombre', req: true },
      { k: 'email', t: 'Correo', soloLectura: true },
      { k: 'rol', t: 'Rol', req: true, tipo: 'select', opciones: () => Object.entries(ROLES) },
    ],
  },
};

const ROLES = { ADMIN: 'Administrador', TI: 'Sistemas', CONSULTA: 'Consulta' };

/* =========================================================
   3. ESTADO
   ========================================================= */
let perfil = null;
let actual = 'proveedores';
let editando = null;
const datos = {};
const aux = { marcas: [], tipos: [] };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const puedeEscribir = cat =>
  !!perfil && (cat.soloAdmin ? perfil.rol === 'ADMIN' : ['ADMIN', 'TI'].includes(perfil.rol));

/* =========================================================
   4. SESIÓN
   ========================================================= */
function mostrarLogin(mensaje) {
  $('vistaApp').hidden = true;
  $('vistaLogin').hidden = false;
  $('loginAviso').hidden = !mensaje;
  $('loginAviso').textContent = mensaje || '';
}

async function entrar(session) {
  const { data, error } = await sb.from('usuarios').select('*').eq('id', session.user.id).maybeSingle();
  if (error || !data) {
    await sb.auth.signOut();
    mostrarLogin('Tu cuenta existe pero aún no está activa. Pide a un administrador que la active.');
    return;
  }
  perfil = data;
  $('quienSoy').textContent = `${perfil.nombre} (${ROLES[perfil.rol]})`;
  $('vistaLogin').hidden = true;
  $('vistaApp').hidden = false;
  await Promise.all([...Object.keys(CATALOGOS).map(cargar), cargarAux()]);
  mostrar(actual);
}

$('formLogin').addEventListener('submit', async e => {
  e.preventDefault();
  if (!configurado) return;
  const btn = $('btnEntrar');
  btn.disabled = true; btn.textContent = 'Entrando…';
  const { data, error } = await sb.auth.signInWithPassword({
    email: $('loginEmail').value.trim(), password: $('loginPass').value,
  });
  btn.disabled = false; btn.textContent = 'Entrar';
  if (error) { mostrarLogin('Correo o contraseña incorrectos.'); return; }
  await entrar(data.session);
});

$('btnRecuperar').addEventListener('click', async () => {
  if (!configurado) return;
  const email = $('loginEmail').value.trim();
  if (!email) { mostrarLogin('Escribe tu correo y vuelve a presionar "Olvidé mi contraseña".'); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split('#')[0] });
  toast(error ? 'No se pudo enviar el correo de recuperación.' : 'Te enviamos un correo para restablecer tu contraseña.', !!error);
});

$('btnSalir').addEventListener('click', async () => {
  await sb.auth.signOut();
  perfil = null;
  mostrarLogin();
});

/* =========================================================
   5. DATOS
   ========================================================= */
async function cargar(key) {
  const cat = CATALOGOS[key];
  const { data, error } = await sb.from(cat.tabla).select(cat.select).order(cat.orden);
  datos[key] = error ? [] : data;
  if (error) toast(`No se pudo cargar ${cat.titulo.toLowerCase()}: ${traducirError(error)}`, true);
}

async function cargarAux() {
  const [m, t] = await Promise.all([
    sb.from('marcas').select('id,nombre').eq('activo', true).order('nombre'),
    sb.from('tipos_equipo').select('id,nombre').eq('activo', true).order('nombre'),
  ]);
  aux.marcas = m.data || [];
  aux.tipos = t.data || [];
}

function traducirError(err) {
  if (!err) return '';
  switch (err.code) {
    case '23505': return 'Ya existe un registro con ese valor.';
    case '23514': return 'Algún dato no cumple las reglas del catálogo. Revisa el formato.';
    case '23503': return 'El registro relacionado no existe o está en uso.';
    case '42501': return 'Tu rol no tiene permiso para esta acción.';
    case 'P0001': return err.message;
    default: return err.message || 'Error desconocido.';
  }
}

/* =========================================================
   6. VISTA DE CATÁLOGO
   ========================================================= */
function pintarNav() {
  $('nav').innerHTML = Object.entries(CATALOGOS).map(([key, cat]) => {
    const activos = (datos[key] || []).filter(r => r.activo).length;
    return `<button class="nav-item" type="button" data-key="${key}" ${key === actual ? 'aria-current="page"' : ''}>
      <span>${esc(cat.titulo)}</span><span class="cuenta">${activos}</span></button>`;
  }).join('');
}

$('nav').addEventListener('click', e => {
  const b = e.target.closest('.nav-item');
  if (b) { $('buscar').value = ''; mostrar(b.dataset.key); }
});

function mostrar(key) {
  actual = key;
  const cat = CATALOGOS[key];
  pintarNav();
  $('titulo').textContent = cat.titulo;
  $('descripcion').textContent = cat.descripcion;
  $('nota').hidden = !(cat.nota && puedeEscribir(cat));
  $('nota').textContent = cat.nota || '';
  const btn = $('btnNuevo');
  btn.hidden = !cat.nuevo || !puedeEscribir(cat);
  btn.textContent = cat.nuevo || '';
  pintarTabla();
}

function pintarTabla() {
  const cat = CATALOGOS[actual];
  const estado = $('filtroEstado').value;
  const q = $('buscar').value.trim().toLowerCase();
  const editable = puedeEscribir(cat);

  const filas = (datos[actual] || [])
    .filter(r => estado === 'todos' || (estado === 'activos' ? r.activo : !r.activo))
    .filter(r => !q || cat.columnas.map(c => c.v(r) ?? '').join(' ').toLowerCase().includes(q));

  if (!filas.length) {
    const total = (datos[actual] || []).length;
    const msg = q ? `Ningún registro coincide con "${esc($('buscar').value)}".`
      : total ? 'No hay registros con este filtro.'
      : `Aún no hay ${cat.titulo.toLowerCase()} registrados.`;
    const cta = !q && !total && cat.nuevo && editable
      ? `<br><button class="btn" type="button" onclick="abrir()">${esc(cat.nuevo)}</button>` : '';
    $('tablaWrap').innerHTML = `<div class="vacio">${msg}${cta}</div>`;
    return;
  }

  $('tablaWrap').innerHTML = `<table>
    <thead><tr>${cat.columnas.map(c => `<th scope="col">${esc(c.t)}</th>`).join('')}<th scope="col"><span class="sr" style="position:absolute;left:-9999px">Estado</span></th></tr></thead>
    <tbody>${filas.map(r => `
      <tr class="${editable ? 'editable' : ''} ${r.activo ? '' : 'inactivo'}" data-id="${esc(r.id)}" ${editable ? 'tabindex="0"' : ''}>
        ${cat.columnas.map(c => {
          const v = c.v(r);
          const cont = c.chip && v ? `<span class="chip">${esc(v)}</span>` : esc(v);
          return `<td class="${c.clase || ''}">${cont}</td>`;
        }).join('')}
        <td>${r.activo ? '' : '<span class="chip chip-inactivo">Inactivo</span>'}</td>
      </tr>`).join('')}
    </tbody></table>`;
}

$('buscar').addEventListener('input', pintarTabla);
$('filtroEstado').addEventListener('change', pintarTabla);
$('btnNuevo').addEventListener('click', () => abrir());

$('tablaWrap').addEventListener('click', e => {
  const tr = e.target.closest('tr.editable');
  if (tr) abrir(datos[actual].find(r => String(r.id) === tr.dataset.id));
});
$('tablaWrap').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const tr = e.target.closest('tr.editable');
  if (tr) abrir(datos[actual].find(r => String(r.id) === tr.dataset.id));
});

/* =========================================================
   7. FORMULARIO
   ========================================================= */
function htmlCampo(c, r) {
  const id = `f_${c.k}`;
  const ayuda = c.ayuda ? `<span class="ayuda" id="${id}_ayuda">${esc(c.ayuda)}</span>` : '';
  const err = `<span class="error" id="${id}_error" hidden></span>`;
  const req = c.req ? ' required' : '';
  const desc = c.ayuda ? ` aria-describedby="${id}_ayuda"` : '';
  const val = r[c.k];

  if (c.tipo === 'check') {
    return `<div class="campo"><label class="opcion"><input type="checkbox" id="${id}" ${val ? 'checked' : ''}> ${esc(c.t)}</label></div>`;
  }
  if (c.tipo === 'control') {
    const actualCtrl = r.id ? controlDe(r) : 'SERIE';
    return `<fieldset class="campo"><legend>${esc(c.t)}</legend>
      ${Object.entries(CONTROLES).map(([k, o]) => `
        <label class="opcion"><input type="radio" name="control" value="${k}" ${k === actualCtrl ? 'checked' : ''}>
          <span>${esc(o.etiqueta)}<small>${esc(o.ayuda)}</small></span></label>`).join('')}
    </fieldset>`;
  }
  let input;
  if (c.tipo === 'select') {
    const ops = c.opciones();
    input = `<select id="${id}"${req}${desc}><option value="">Selecciona…</option>
      ${ops.map(([v, t]) => `<option value="${esc(v)}" ${String(v) === String(val ?? '') ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
  } else if (c.tipo === 'textarea' || c.tipo === 'specs') {
    const t = c.tipo === 'specs' ? specsATexto(val) : (val ?? '');
    input = `<textarea id="${id}"${desc}>${esc(t)}</textarea>`;
  } else {
    const type = c.tipo === 'number' ? 'number' : c.tipo === 'email' ? 'email' : 'text';
    const extra = c.tipo === 'number' ? ' min="0" step="1"' : '';
    input = `<input type="${type}" id="${id}" value="${esc(val ?? '')}"${req}${desc}${extra}${c.soloLectura ? ' readonly' : ''}${c.mayus ? ' style="text-transform:uppercase"' : ''}>`;
  }
  return `<div class="campo" id="${id}_campo"><label for="${id}">${esc(c.t)}${c.req ? '' : ' <span style="font-weight:400;color:var(--muted)">(opcional)</span>'}</label>${input}${ayuda}${err}</div>`;
}

function abrir(registro) {
  const cat = CATALOGOS[actual];
  editando = registro || null;
  const r = registro || { activo: true, requiere_resguardo: true, dias_credito: 0 };
  $('panelTitulo').textContent = registro ? `Editar ${cat.singular}` : cat.nuevo;

  let html = cat.campos.map(c => htmlCampo(c, r)).join('');
  const esUnoMismo = actual === 'usuarios' && registro && registro.id === perfil.id;
  if (registro && !esUnoMismo) {
    html += `<div class="campo"><label class="opcion"><input type="checkbox" id="f_activo" ${r.activo ? 'checked' : ''}>
      <span>Activo<small>Los registros inactivos no aparecen para nuevas altas, pero conservan su historial.</small></span></label></div>`;
  }
  if (esUnoMismo) html += `<p class="nota">No puedes cambiar tu propio rol ni desactivar tu cuenta.</p>`;
  $('panelCampos').innerHTML = html;
  if (esUnoMismo) $('f_rol').disabled = true;
  $('panel').showModal();
  $('panelCampos').querySelector('input:not([readonly]):not([type=checkbox]):not([type=radio]), select')?.focus();
}

function cerrarPanel() { $('panel').close(); editando = null; }
$('btnCerrar').addEventListener('click', cerrarPanel);
$('btnCancelar').addEventListener('click', cerrarPanel);

function marcarError(c, msg) {
  const campo = $(`f_${c.k}_campo`), e = $(`f_${c.k}_error`);
  if (!campo) return;
  campo.classList.toggle('invalido', !!msg);
  e.hidden = !msg; e.textContent = msg || '';
}

function leerFormulario(cat) {
  const payload = {};
  let valido = true;
  for (const c of cat.campos) {
    if (c.soloLectura) continue;
    if (c.tipo === 'control') {
      const ctrl = document.querySelector('input[name=control]:checked').value;
      payload.requiere_serie = ctrl !== 'CANTIDAD';
      payload.requiere_imei = ctrl === 'IMEI';
      payload.es_consumible = ctrl === 'CANTIDAD';
      continue;
    }
    const el = $(`f_${c.k}`);
    if (c.tipo === 'check') { payload[c.k] = el.checked; continue; }
    if (el.disabled) continue;
    if (c.tipo === 'specs') { payload[c.k] = textoASpecs(el.value); continue; }

    let v = el.value.trim();
    if (c.mayus) v = v.toUpperCase().replace(/\s+/g, c.k === 'rfc' ? '' : ' ');
    let msg = '';
    if (c.req && !v) msg = 'Este campo es obligatorio.';
    else if (v && c.patron && !c.patron.test(v)) msg = c.msgPatron;
    else if (v && c.tipo === 'email' && !el.checkValidity()) msg = 'Correo no válido.';
    marcarError(c, msg);
    if (msg) valido = false;

    if (c.tipo === 'number' || c.num) payload[c.k] = v === '' ? (c.k === 'dias_credito' ? 0 : null) : Number(v);
    else payload[c.k] = v === '' ? null : v;
  }
  const act = $('f_activo');
  if (act) payload.activo = act.checked;
  else if (!editando && actual !== 'usuarios') payload.activo = true;
  return valido ? payload : null;
}

$('formRegistro').addEventListener('submit', async e => {
  e.preventDefault();
  const cat = CATALOGOS[actual];
  const payload = leerFormulario(cat);
  if (!payload) {
    $('panelCampos').querySelector('.invalido input, .invalido select, .invalido textarea')?.focus();
    return;
  }
  const btn = $('btnGuardar');
  btn.disabled = true; btn.textContent = 'Guardando…';
  const q = editando
    ? sb.from(cat.tabla).update(payload).eq('id', editando.id)
    : sb.from(cat.tabla).insert(payload);
  const { error } = await q;
  btn.disabled = false; btn.textContent = 'Guardar';

  if (error) { toast(traducirError(error), true); return; }
  const nombre = cat.singular.charAt(0).toUpperCase() + cat.singular.slice(1);
  const fem = ['marca'].includes(cat.singular);
  toast(`${nombre} ${editando ? (fem ? 'actualizada' : 'actualizado') : (fem ? 'guardada' : 'guardado')}.`);
  cerrarPanel();
  await cargar(actual);
  if (actual === 'marcas' || actual === 'tipos') await cargarAux();
  mostrar(actual);
});

/* =========================================================
   8. AVISOS
   ========================================================= */
let toastTimer;
function toast(msg, esError = false) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.toggle('error', esError);
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.hidden = true), esError ? 6000 : 3000);
}

/* =========================================================
   9. ARRANQUE
   ========================================================= */
(async function init() {
  if (!configurado) {
    mostrarLogin('Falta configurar la conexión: abre index.html y pega tu Project URL y anon key de Supabase en la sección 1 del script.');
    $('btnEntrar').disabled = true;
    return;
  }
  sb.auth.onAuthStateChange(async (evento) => {
    if (evento === 'PASSWORD_RECOVERY') {
      const nueva = prompt('Escribe tu nueva contraseña (mínimo 8 caracteres):');
      if (nueva && nueva.length >= 8) {
        const { error } = await sb.auth.updateUser({ password: nueva });
        toast(error ? 'No se pudo cambiar la contraseña.' : 'Contraseña actualizada.', !!error);
      }
    }
  });
  const { data: { session } } = await sb.auth.getSession();
  if (session) await entrar(session); else mostrarLogin();
})();
</script>
