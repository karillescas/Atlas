<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de equipos TI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Colores y tipografía de la aplicación */
:root {
  --bg: #EDF0F1;
  --panel: #FFFFFF;
  --ink: #16252D;
  --muted: #5B6B73;
  --line: #CBD3D7;
  --accent: #0E5A73;
  --accent-soft: #DCEBF0;
  --on-accent: #FFFFFF;
  --rail: #1E3440;
  --rail-ink: #E4EAEC;
  --rail-muted: #9FB2BB;
  --signal: #E3B23C;
  --danger: #B3261E;
  --danger-soft: #F9E1DF;

  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color: var(--ink);
  font-size: 16px;
  line-height: 1.45;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111A1E; --panel: #182329; --ink: #E4EAEC; --muted: #93A3AA; --line: #2E3B42;
    --accent: #5AAECB; --accent-soft: #1D3A46; --on-accent: #0B1A20;
    --rail: #0B1317; --rail-ink: #E4EAEC; --rail-muted: #7F939C;
    --danger: #F2867D; --danger-soft: #3A1F1D;
  }
}
:root[data-theme="dark"] {
  --bg: #111A1E; --panel: #182329; --ink: #E4EAEC; --muted: #93A3AA; --line: #2E3B42;
  --accent: #5AAECB; --accent-soft: #1D3A46; --on-accent: #0B1A20;
  --rail: #0B1317; --rail-ink: #E4EAEC; --rail-muted: #7F939C;
  --danger: #F2867D; --danger-soft: #3A1F1D;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { height: 100%; margin: 0; background: var(--bg); }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Botones y campos ---------- */
.btn {
  display: inline-flex; align-items: center; gap: .4rem;
  border: 1px solid transparent; border-radius: 6px;
  padding: .55rem 1rem; cursor: pointer; font-weight: 600;
  background: var(--accent); color: var(--on-accent);
}
.btn:disabled { opacity: .55; cursor: progress; }
.btn-sec { background: transparent; color: var(--ink); border-color: var(--line); }
.btn-link { background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; }
.campo { display: flex; flex-direction: column; gap: .3rem; margin-bottom: 1rem; }
.campo label, .campo legend { font-size: .85rem; font-weight: 600; }
.campo .ayuda { font-size: .8rem; color: var(--muted); }
.campo .error { font-size: .8rem; color: var(--danger); }
input[type=text], input[type=email], input[type=number], input[type=password], input[type=search], select, textarea {
  width: 100%; padding: .55rem .7rem; border: 1px solid var(--line);
  border-radius: 6px; background: var(--panel);
}
input[readonly] { background: var(--bg); color: var(--muted); }
textarea { min-height: 5.5rem; resize: vertical; }
.campo.invalido input, .campo.invalido select, .campo.invalido textarea { border-color: var(--danger); }
fieldset.campo { border: 1px solid var(--line); border-radius: 6px; padding: .7rem .9rem; }
.opcion { display: flex; gap: .55rem; align-items: flex-start; padding: .3rem 0; font-size: .92rem; }
.opcion input { margin-top: .25rem; }
.opcion small { display: block; color: var(--muted); }

/* ---------- Login ---------- */
.login { min-height: 100%; display: grid; place-items: center; padding: 1.5rem; }
.login-card {
  width: min(380px, 100%); background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 2rem;
}
.login-card h1 { font-stretch: 80%; font-size: 1.75rem; line-height: 1.1; margin: 0 0 .35rem; }
.login-card p { color: var(--muted); margin: 0 0 1.5rem; }
.aviso { background: var(--danger-soft); color: var(--danger); border-radius: 6px; padding: .7rem .9rem; font-size: .9rem; margin-bottom: 1rem; }

/* ---------- Estructura ---------- */
.app { display: grid; grid-template-columns: 250px 1fr; height: 100%; }
.rail { background: var(--rail); color: var(--rail-ink); display: flex; flex-direction: column; min-height: 0; }
.marca-app { padding: 1.4rem 1.25rem 1rem; }
.marca-app strong { display: block; font-stretch: 78%; font-size: 1.35rem; line-height: 1.1; }
.marca-app span { color: var(--rail-muted); font-size: .85rem; }
.rail nav { display: flex; flex-direction: column; padding: .5rem 0; flex: 1; }
.nav-item {
  display: flex; justify-content: space-between; align-items: baseline;
  background: none; border: none; border-left: 4px solid transparent;
  color: var(--rail-ink); padding: .65rem 1.25rem .65rem 1rem; cursor: pointer; text-align: left;
}
.nav-item:hover { background: rgba(255,255,255,.05); }
.nav-item[aria-current="page"] { border-left-color: var(--signal); background: rgba(255,255,255,.08); font-weight: 600; }
.nav-item .cuenta { color: var(--rail-muted); font-variant-numeric: tabular-nums; font-size: .85rem; }
.nav-grupo { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--rail-muted); padding: 1rem 1.25rem .35rem; }
.chip-alerta { background: var(--danger-soft); color: var(--danger); }
.resumen { display: flex; gap: .5rem; flex-wrap: wrap; margin: .6rem 0 0; }
.resumen span { font-size: .85rem; padding: .2rem .6rem; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); font-variant-numeric: tabular-nums; }
.acciones { display: flex; gap: .6rem; flex-wrap: wrap; }
.zona-archivo { border: 2px dashed var(--line); border-radius: 8px; padding: 1.25rem; text-align: center; margin-bottom: 1rem; }
.cifras { display: grid; grid-template-columns: repeat(2, 1fr); gap: .6rem; margin: 1rem 0; }
.cifras div { border: 1px solid var(--line); border-radius: 6px; padding: .6rem .8rem; }
.cifras strong { display: block; font-size: 1.5rem; font-stretch: 85%; font-variant-numeric: tabular-nums; }
.cifras span { font-size: .82rem; color: var(--muted); }
.th-btn { background: none; border: none; padding: 0; font: inherit; color: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: .35rem; font-weight: 600; white-space: nowrap; }
.th-btn:hover { color: var(--ink); }
.th-btn.activo { color: var(--accent); }
.th-ico { display: inline-flex; width: 14px; height: 14px; }
.th-ico svg { width: 14px; height: 14px; }
.col-sel { width: 2.5rem; }
.col-sel input { width: 1.05rem; height: 1.05rem; cursor: pointer; }
tr.seleccionada td { background: var(--accent-soft); }
.barra-sel { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; background: var(--rail); color: var(--rail-ink);
  border-radius: 8px; padding: .6rem .9rem; margin-bottom: 1rem; }
.barra-sel .btn-sec { color: var(--rail-ink); border-color: rgba(255,255,255,.3); }
.barra-sel .btn-link { color: var(--rail-ink); margin-left: auto; }
.chip-ok { background: #DCEFE0; color: #1E5B2C; }
:root[data-theme="dark"] .chip-ok { background: #1C3A24; color: #9ED8AC; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip-ok { background: #1C3A24; color: #9ED8AC; } }
.lista-errores { max-height: 320px; overflow-y: auto; margin: .5rem 0 0; padding: 0; list-style: none; font-size: .88rem;
  border: 1px solid var(--line); border-radius: 6px; }
.lista-errores li { padding: .5rem .75rem; border-bottom: 1px solid var(--line); }
.lista-errores li:last-child { border-bottom: none; }
.lista-errores strong { font-variant-numeric: tabular-nums; }
.paso { font-size: .92rem; margin: 0 0 .75rem; }
.buscador { position: relative; }
.buscador-ops { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 5; margin: 0; padding: .25rem 0; list-style: none;
  max-height: 260px; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 20px rgba(0,0,0,.15); }
.buscador-ops li { padding: .45rem .75rem; cursor: pointer; font-size: .92rem; }
.buscador-ops li small { display: block; color: var(--muted); font-size: .8rem; }
.buscador-ops li[aria-selected="true"], .buscador-ops li:hover { background: var(--accent-soft); }
.buscador-ops li.sin { cursor: default; color: var(--muted); }
.buscador-ops li.sin:hover { background: none; }
dialog.panel.ancho { width: min(1040px, 100%); }
.etq { font-size: .85rem; font-weight: 600; }
.pasos { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1rem; }
.pasos span { font-size: .8rem; padding: .2rem .65rem; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.pasos span.actual { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.pasos span:empty { display: none; }
.compra-cab { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: .75rem 1rem; margin: 0 0 1rem;
  padding: .9rem 1rem; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.compra-cab dt { font-size: .78rem; color: var(--muted); }
.compra-cab dd { margin: .15rem 0 0; font-weight: 600; overflow-wrap: anywhere; }
.concepto { border: 1px solid var(--line); border-radius: 8px; margin-bottom: .8rem; background: var(--panel); }
.concepto.rol-ENVIO, .concepto.rol-OMITIR { background: var(--bg); }
.concepto.rol-MATERIAL { border-left: 4px solid var(--signal); }
.concepto-cab { display: flex; gap: 1rem; justify-content: space-between; align-items: flex-start; padding: .75rem 1rem; border-bottom: 1px solid var(--line); }
.concepto-cab small { display: block; color: var(--muted); font-size: .82rem; margin-top: .2rem; }
.concepto-acciones { display: flex; flex-direction: column; align-items: flex-end; gap: .35rem; flex: none; }
.concepto-acciones select { width: auto; max-width: 220px; }
.concepto-cuerpo { padding: .75rem 1rem; }
.rejilla { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .6rem .9rem; }
.rejilla .campo { margin-bottom: 0; }
.costo-linea { margin: .6rem 0 0; font-size: .88rem; color: var(--muted); }
.totales { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .6rem; margin-top: 1rem; }
.totales div { border: 1px solid var(--line); border-radius: 6px; padding: .6rem .8rem; }
.totales span { display: block; font-size: .8rem; color: var(--muted); }
.totales strong { font-variant-numeric: tabular-nums; }
@media (max-width: 640px) { .concepto-cab { flex-direction: column; } .concepto-acciones { align-items: stretch; } }
.tarjeta-op { border: 1px solid var(--line); border-radius: 8px; padding: .7rem .8rem; cursor: pointer; background: var(--panel); }
.tarjeta-op.activa { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
h3.sub { margin: 1.25rem 0 .6rem; font-size: 1rem; }
.conteo { align-self: center; color: var(--muted); font-size: .88rem; white-space: nowrap; }
.pop { position: fixed; z-index: 20; width: min(300px, calc(100vw - 16px)); background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 28px rgba(0, 0, 0, .18); display: flex; flex-direction: column; overflow: hidden; }
.pop-ord { border-bottom: 1px solid var(--line); padding: .25rem 0; }
.pop-ord button { display: flex; gap: .5rem; width: 100%; text-align: left; background: none; border: none; padding: .5rem .9rem; cursor: pointer; font-size: .9rem; }
.pop-ord button:hover, .pop-ord button[aria-pressed="true"] { background: var(--accent-soft); }
.pop-cuerpo { padding: .6rem .9rem; display: flex; flex-direction: column; gap: .45rem; min-height: 0; }
.pop-lista { overflow-y: auto; max-height: 240px; border: 1px solid var(--line); border-radius: 6px; padding: .2rem .55rem; }
.pop-op { display: flex; gap: .5rem; align-items: flex-start; padding: .25rem 0; font-size: .88rem; cursor: pointer; }
.pop-op input { margin-top: .2rem; flex: none; }
.pop-op .n { margin-left: auto; padding-left: .5rem; color: var(--muted); font-variant-numeric: tabular-nums; font-size: .8rem; }
.pop-todos { font-weight: 600; }
.pop-pie { display: flex; justify-content: space-between; gap: .5rem; padding: .6rem .9rem; border-top: 1px solid var(--line); }
.btn-chico { padding: .4rem .8rem; font-size: .88rem; }
.rail-pie { padding: 1rem 1.25rem; border-top: 1px solid rgba(255,255,255,.1); font-size: .85rem; }
.rail-pie .rol { color: var(--rail-muted); display: block; margin-bottom: .5rem; }
.rail-pie button { background: none; border: 1px solid rgba(255,255,255,.25); color: var(--rail-ink); border-radius: 6px; padding: .35rem .8rem; cursor: pointer; }

main { overflow-y: auto; padding: 2rem clamp(1rem, 3vw, 2.5rem); min-width: 0; }
.encabezado { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
.encabezado h1 { margin: 0; font-stretch: 78%; font-size: clamp(1.9rem, 3.5vw, 2.6rem); line-height: 1; }
.encabezado p { margin: .45rem 0 0; color: var(--muted); max-width: 60ch; }
.barra { display: flex; gap: .6rem; flex-wrap: wrap; margin-bottom: 1rem; }
.barra input[type=search] { flex: 1 1 260px; }
.barra select { flex: 0 0 auto; width: auto; }
.nota { font-size: .88rem; color: var(--muted); margin: 0 0 1rem; }

.tabla-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th { text-align: left; font-size: .8rem; font-weight: 600; color: var(--muted); padding: .7rem .9rem; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--panel); }
td { padding: .65rem .9rem; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: none; }
tbody tr.editable { cursor: pointer; }
tbody tr.editable:hover td { background: var(--accent-soft); }
tr.inactivo td { color: var(--muted); }
.mono { font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.chip { display: inline-block; font-size: .78rem; padding: .1rem .5rem; border-radius: 4px; background: var(--accent-soft); color: var(--ink); white-space: nowrap; }
.chip-inactivo { background: var(--signal); color: #2A2106; }
.vacio { padding: 3rem 1.5rem; text-align: center; color: var(--muted); }
.vacio .btn { margin-top: 1rem; }

/* ---------- Panel lateral de edición ---------- */
dialog.panel {
  margin: 0 0 0 auto; height: 100%; max-height: 100%; width: min(480px, 100%);
  border: none; padding: 0; background: var(--panel); color: var(--ink);
  border-left: 1px solid var(--line);
}
dialog.panel::backdrop { background: rgba(8, 18, 22, .45); }
dialog.panel form { display: flex; flex-direction: column; height: 100%; }
.panel-cab { padding: calc(1.25rem + env(safe-area-inset-top, 0px)) 1.5rem 1rem; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.panel-cab h2 { margin: 0; font-stretch: 85%; font-size: 1.4rem; }
.panel-cuerpo { padding: 1.25rem 1.5rem; overflow-y: auto; flex: 1; }
.panel-pie { padding: 1rem 1.5rem calc(1rem + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: .6rem; }
.cerrar { background: none; border: none; font-size: 1.5rem; line-height: 1; cursor: pointer; color: var(--muted); padding: .2rem .4rem; }

.toast {
  position: fixed; left: 50%; bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: .7rem 1.2rem; border-radius: 6px; font-size: .92rem; z-index: 10; max-width: calc(100% - 2rem);
}
.toast.error { background: var(--danger); color: #fff; }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .rail { flex-direction: row; align-items: stretch; overflow-x: auto; }
  .marca-app { display: none; }
  .rail nav { flex-direction: row; padding: 0; }
  .nav-item { border-left: none; border-bottom: 4px solid transparent; padding: .8rem 1rem; gap: .5rem; white-space: nowrap; }
  .nav-item[aria-current="page"] { border-bottom-color: var(--signal); }
  .nav-grupo { display: none; }
  .rail-pie { border-top: none; display: flex; align-items: center; gap: .6rem; padding: .5rem 1rem; }
  .rail-pie .rol { display: none; }
  main { padding: 1.25rem 1rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<section class="login" id="vistaLogin" hidden>
  <div class="login-card">
    <h1>Control de equipos TI</h1>
    <p>Inicia sesión con tu cuenta de Sistemas.</p>
    <div class="aviso" id="loginAviso" hidden></div>
    <form id="formLogin" novalidate>
      <div class="campo">
        <label for="loginEmail">Correo</label>
        <input type="email" id="loginEmail" autocomplete="username" required>
      </div>
      <div class="campo">
        <label for="loginPass">Contraseña</label>
        <input type="password" id="loginPass" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit" id="btnEntrar" style="width:100%;justify-content:center">Entrar</button>
    </form>
    <p style="margin:1rem 0 0;font-size:.88rem">
      <button class="btn-link" type="button" id="btnRecuperar">Olvidé mi contraseña</button>
    </p>
  </div>
</section>

<!-- ================= APP ================= -->
<div class="app" id="vistaApp" hidden>
  <aside class="rail">
    <div class="marca-app">
      <strong>Control de equipos TI</strong>
      <span>Sistemas</span>
    </div>
    <nav id="nav" aria-label="Catálogos"></nav>
    <div class="rail-pie">
      <span class="rol" id="quienSoy"></span>
      <button type="button" id="btnSalir">Cerrar sesión</button>
    </div>
  </aside>

  <main>
    <div class="encabezado">
      <div>
        <h1 id="titulo"></h1>
        <p id="descripcion"></p>
        <div class="resumen" id="resumen" hidden></div>
      </div>
      <div class="acciones">
        <span class="acciones" id="accionesExtra"></span>
        <button class="btn" type="button" id="btnNuevo"></button>
      </div>
    </div>
    <div class="barra">
      <input type="search" id="buscar" placeholder="Buscar" aria-label="Buscar en el catálogo">
      <select id="filtroExtra" aria-label="Filtro adicional" hidden></select>
    <button class="btn btn-sec btn-chico" type="button" id="btnQuitarFiltros" hidden>Quitar filtros de columnas</button>
    <span class="conteo" id="conteo" aria-live="polite"></span>
    <select id="filtroEstado" aria-label="Filtrar por estado">
        <option value="activos">Activos</option>
        <option value="inactivos">Inactivos</option>
        <option value="todos">Todos</option>
      </select>
    </div>
    <p class="nota" id="nota" hidden></p>
    <div class="barra-sel" id="barraSel" hidden></div>
    <div class="tabla-wrap" id="tablaWrap"></div>
  </main>
</div>

<!-- ================= PANEL DE EDICIÓN ================= -->
<dialog class="panel" id="panel" aria-labelledby="panelTitulo">
  <form id="formRegistro" novalidate>
    <div class="panel-cab">
      <h2 id="panelTitulo"></h2>
      <button type="button" class="cerrar" id="btnCerrar" aria-label="Cerrar">×</button>
    </div>
    <div class="panel-cuerpo" id="panelCampos"></div>
    <div class="panel-pie">
      <button type="button" class="btn btn-sec" id="btnAtras" hidden style="margin-right:auto">Atrás</button>
      <button type="button" class="btn btn-sec" id="btnCancelar">Cancelar</button>
      <button type="submit" class="btn" id="btnGuardar">Guardar</button>
    </div>
  </form>
</dialog>

<div class="pop" id="pop" role="dialog" aria-label="Filtro de columna" hidden></div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
/* =========================================================
   1. CONEXIÓN — pega aquí los datos de tu proyecto Supabase
      (Project Settings > API > Project URL y anon public key)
   ========================================================= */
const SUPABASE_URL = 'https://yoalzgvfpshdverbgors.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ZHMN8aaLLQjpp-V8DshNmg_8yir-Zp9';

const configurado = !SUPABASE_URL.includes('TU-PROYECTO') && !SUPABASE_ANON_KEY.startsWith('TU_');
const sb = configurado ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* =========================================================
   2. DEFINICIÓN DE CATÁLOGOS
      Cada catálogo describe su tabla, columnas y campos.

async function entrar(session) {
  const { data, error } = await sb.from('usuarios').select('*').eq('id', session.user.id).maybeSingle();
  if (error || !data) {
    await sb.auth.signOut();
    mostrarLogin(error
      ? `Entraste, pero no se pudo leer tu perfil: ${traducirError(error)}`
      : 'Tu cuenta existe pero aún no está activa. Pide a un administrador que la active.');
    return;
  }
  perfil = data;
  $('quienSoy').textContent = `${perfil.nombre} (${ROLES[perfil.rol]})`;

  $('vistaApp').hidden = false;

function explicarErrorLogin(error) {
  const m = (error.message || '').toLowerCase();
  if (m.includes('invalid login credentials'))
    return 'La contraseña no coincide con ese correo, o el usuario no existe en Supabase (Authentication > Users).';
  if (m.includes('email not confirmed'))
    return 'Tu correo aún no está confirmado. En Supabase, confirma el usuario o vuelve a crearlo marcando "Auto Confirm User".';
  if (m.includes('api key') || m.includes('apikey') || m.includes('jwt'))
    return 'La llave de Supabase en index.html no es válida. Copia de nuevo la anon/publishable key en Project Settings > API.';
  if (m.includes('failed to fetch') || m.includes('network') || m.includes('load failed'))
    return 'No se pudo conectar con Supabase. Revisa que la Project URL en index.html esté bien escrita (https://xxxx.supabase.co).';
  if (m.includes('email logins are disabled') || m.includes('provider is not enabled'))
    return 'El acceso por correo está desactivado. En Supabase, activa Email en Authentication > Providers.';
  return `Supabase respondió: ${error.message}`;
}

async function cargar(key) {
  const cat = CATALOGOS[key];
  if (cat.fuente) return cargar(cat.fuente);
  const BLOQUE = 1000;   // Supabase entrega máximo 1000 renglones por consulta
  let todo = [];
  for (let desde = 0; ; desde += BLOQUE) {
    let q = sb.from(cat.tabla).select(cat.select).order(cat.orden);
    if (cat.orden !== 'id') q = q.order('id');
    const { data, error } = await q.range(desde, desde + BLOQUE - 1);
    if (error) { toast(`No se pudo cargar ${cat.titulo.toLowerCase()}: ${traducirError(error)}`, true); break; }
    todo = todo.concat(data);
    if (data.length < BLOQUE) break;
  }
  if (cat.siempreActivo) todo.forEach(r => (r.activo = true));
  datos[key] = todo;
}

async function cargarAux() {
  const [m, t] = await Promise.all([
    sb.from('marcas').select('id,nombre').eq('activo', true).order('nombre'),
    sb.from('tipos_equipo').select('id,nombre').eq('activo', true).order('nombre'),
  ]);
  const { data: rad } = await sb.from('radiografias').select('*').order('created_at', { ascending: false }).limit(1);
  ultimaCarga = rad?.[0] || null;
  const [cc, co] = await Promise.all([
    sb.from('centros_costo').select('id,clave,nombre,activo').order('clave'),
    sb.from('colaboradores').select('id,nombre,apellidos,num_empleado,area,activo,tipo_colaborador').order('nombre'),
  ]);
  const [tf, mo, pr, mb] = await Promise.all([
    sb.from('tipos_equipo').select('id,nombre,clave,categoria,requiere_serie,requiere_imei,es_consumible,vida_util_meses,activo').order('nombre'),
    sb.from('modelos').select('id,nombre,marca_id,tipo_id,activo,vida_util_meses,marcas(nombre)').order('nombre'),
    sb.from('proveedores').select('id,rfc,razon_social,activo').order('razon_social'),
    sb.from('motivos_baja').select('id,nombre,activo').order('nombre'),
  ]);
  aux.tiposFull = tf.data || [];
  aux.modelos = (mo.data || []).map(m => ({ ...m, marca: m.marcas?.nombre || '' }));
  aux.proveedores = pr.data || [];
  aux.motivos = mb.data || [];
  aux.centros = cc.data || [];
  aux.colaboradores = co.data || [];
  aux.marcas = m.data || [];
  aux.tipos = t.data || [];
}

function traducirError(err) {
  if (!err) return '';
  const m = err.message || '';
  const especificos = {
    ux_colab_num_empleado: 'Ya existe un colaborador con ese número de empleado.',
    ux_colab_email: 'Ya existe un colaborador con ese correo.',
    ux_colab_usuario_kore: 'Ya existe un colaborador con ese usuario de Kore.',
    ux_centros_clave: 'Ya existe un centro de costo con esa clave.',
    ck_colab_jefe_distinto: 'Una persona no puede ser su propio jefe directo.',
    ck_colab_email: 'El correo no tiene un formato válido.',
    ux_equipos_serie: `Ya existe un equipo con el número de serie ${(err.details || '').match(/=\((.*)\)/)?.[1] || ''}.`,
    ux_equipos_imei: `Ya existe un equipo con el IMEI ${(err.details || '').match(/=\((.*)\)/)?.[1] || ''}.`,
    ux_compras_uuid: 'Esta factura ya se había cargado.',
    ck_equipos_baja: 'Para dar de baja indica el motivo y la fecha.',
    equipos_imei_check: 'El IMEI debe tener 15 dígitos.',
    ux_motivos_nombre: 'Ya existe un motivo con ese nombre.',
    ux_resguardo_linea_vigente: 'Esa línea ya tiene un resguardo vigente.',
    ux_resguardo_equipo_vigente: 'Ese celular ya tiene un resguardo vigente.',
  };
  for (const [k, txt] of Object.entries(especificos)) if (m.includes(k)) return txt;
  switch (err.code) {
    case '23505': return 'Ya existe un registro con ese valor.';
    case '23514': return 'Algún dato no cumple las reglas del catálogo. Revisa el formato.';
    case '23503': return 'El registro relacionado no existe o está en uso.';
    case '42501': return 'Tu rol no tiene permiso para esta acción.';
    case 'P0001': return err.message;
    default: return err.message || 'Error desconocido.';
  }
}

const valorCol = (c, r) => { const v = c.v(r); return v == null || v === '' ? VACIO : String(v); };

function filasFiltradas(cat, excluirIdx = -1) {
  const estado = $('filtroEstado').value;
  const q = $('buscar').value.trim().toLowerCase();
  const fc = filtrosCol[actual] || {};
  return filasDe(actual)
    .filter(r => estado === 'todos' || (estado === 'activos' ? r.activo : !r.activo))
    .filter(r => !cat.filtro || !$('filtroExtra').value || r[cat.filtro.k] === $('filtroExtra').value)
    .filter(r => !q || cat.columnas.map(c => c.v(r) ?? '').join(' ').toLowerCase().includes(q))
    .filter(r => Object.entries(fc).every(([i, set]) => Number(i) === excluirIdx || set.has(valorCol(cat.columnas[i], r))));
}

function comparar(x, y) {
  const vx = x == null || x === '', vy = y == null || y === '';
  if (vx || vy) return vx === vy ? 0 : (vx ? 1 : -1);
  const nx = Number(x), ny = Number(y);
  if (!isNaN(nx) && !isNaN(ny)) return nx - ny;
  return String(x).localeCompare(String(y), 'es', { numeric: true, sensitivity: 'base' });
}

function pintarTabla() {
  const cat = CATALOGOS[actual];
  const editable = puedeEscribir(cat) || !!cat.verFn;
  const total = filasDe(actual).length;
  const fc = filtrosCol[actual] || {};
  const hayFiltrosCol = Object.keys(fc).length > 0;
  $('btnQuitarFiltros').hidden = !hayFiltrosCol;

  if (!total) {
    $('conteo').textContent = '';
    const cta = cat.nuevo && editable ? `<br><button class="btn" type="button" onclick="abrir()">${esc(cat.nuevo)}</button>` : '';
    $('tablaWrap').innerHTML = `<div class="vacio">Aún no hay ${cat.titulo.toLowerCase()} registrados.${cta}</div>`;
    return;
  }

  const filas = filasFiltradas(cat);
  const o = ordenCol[actual];
  if (o) {
    const c = cat.columnas[o.idx];
    const clave = r => c.ord ? c.ord(r) : c.v(r);
    filas.sort((a, b) => {
      const ka = clave(a), kb = clave(b);
      const vacios = (ka == null || ka === '') - (kb == null || kb === '');
      return vacios || o.dir * comparar(ka, kb);   // vacías siempre al final
    });
  }
  $('conteo').textContent = filas.length === total ? `${total} registros` : `Mostrando ${filas.length} de ${total}`;

  const cabeza = cat.columnas.map((c, i) => {
    const filtrada = !!fc[i];
    const ordenada = o && o.idx === i;
    const ico = filtrada ? ICONOS.filtro : ordenada ? (o.dir === 1 ? ICONOS.asc : ICONOS.desc) : ICONOS.menu;
    const estado = [filtrada ? 'filtrada' : '', ordenada ? (o.dir === 1 ? 'orden ascendente' : 'orden descendente') : ''].filter(Boolean).join(', ');
    return `<th scope="col"${ordenada ? ` aria-sort="${o.dir === 1 ? 'ascending' : 'descending'}"` : ''}>
      <button type="button" class="th-btn${filtrada || ordenada ? ' activo' : ''}" data-col="${i}" aria-haspopup="dialog"
        aria-label="${esc(c.t)}: filtrar y ordenar${estado ? ` (${estado})` : ''}">${esc(c.t)}<span class="th-ico" aria-hidden="true">${ico}</span></button></th>`;
  }).join('');

  const conSel = !!cat.seleccion && editable;
  const visiblesIds = filas.map(r => String(r.id));
  [...seleccion].forEach(id => { if (!visiblesIds.includes(id)) seleccion.delete(id); });   // solo lo que se ve
  const marcadas = visiblesIds.filter(id => seleccion.has(id)).length;
  const thSel = conSel ? `<th scope="col" class="col-sel"><input type="checkbox" class="sel-todos" aria-label="Seleccionar las ${filas.length} filas mostradas"
      ${marcadas && marcadas === filas.length ? 'checked' : ''}></th>` : '';
  pintarBarraSel(cat);

  const cuerpo = filas.length ? filas.map(r => `
      <tr class="${editable ? 'editable' : ''} ${r.activo ? '' : 'inactivo'} ${seleccion.has(String(r.id)) ? 'seleccionada' : ''}" data-id="${esc(r.id)}" ${editable ? 'tabindex="0"' : ''}>
        ${conSel ? `<td class="col-sel"><input type="checkbox" class="sel-fila" aria-label="Seleccionar ${esc(cat.columnas[0].v(r))}" ${seleccion.has(String(r.id)) ? 'checked' : ''}></td>` : ''}
        ${cat.columnas.map(c => {
          const v = c.v(r);
          const chip = typeof c.chip === 'function' ? c.chip(r) : c.chip;
          const cont = chip && v ? `<span class="chip${chip === 'alerta' ? ' chip-alerta' : chip === 'ok' ? ' chip-ok' : ''}">${esc(v)}</span>` : esc(v);
          return `<td class="${c.clase || ''}">${cont}</td>`;
        }).join('')}
        ${cat.sinColEstado ? '' : `<td>${r.activo ? '' : '<span class="chip chip-inactivo">Inactivo</span>'}</td>`}
      </tr>`).join('')
    : `<tr><td colspan="${cat.columnas.length + (cat.sinColEstado ? 0 : 1) + (cat.seleccion && editable ? 1 : 0)}" class="vacio">Ningún registro coincide con los filtros.
        ${hayFiltrosCol ? '<br><button class="btn btn-sec btn-chico" type="button" onclick="quitarFiltros()">Quitar filtros de columnas</button>' : ''}</td></tr>`;

  $('tablaWrap').innerHTML = `<table>
    <thead><tr>${thSel}${cabeza}${cat.sinColEstado ? '' : '<th scope="col"><span style="position:absolute;left:-9999px">Estado</span></th>'}</tr></thead>
    <tbody>${cuerpo}</tbody></table>`;
  const st = $('tablaWrap').querySelector('.sel-todos');
  if (st) st.indeterminate = marcadas > 0 && marcadas < filas.length;
}

/* ---------- Selección y cambio de condición en bloque ---------- */
function pintarBarraSel(cat) {
  const barra = $('barraSel');
  if (!cat.seleccion || !seleccion.size) { barra.hidden = true; return; }
  const n = seleccion.size;
  barra.innerHTML = `<span><strong>${n}</strong> ${n === 1 ? cat.singular + ' seleccionada' : cat.titulo.toLowerCase() + ' seleccionadas'}.</span>
    <span>${esc(cat.seleccion.titulo)}:</span>
    ${Object.entries(cat.seleccion.opciones).map(([v, t]) => `<button type="button" class="btn btn-sec btn-chico" data-masivo="${v}">${esc(t)}</button>`).join('')}
    <button type="button" class="btn-link" data-masivo="">Cancelar selección</button>`;
  barra.hidden = false;
}

$('barraSel').addEventListener('click', async e => {
  const b = e.target.closest('[data-masivo]');
  if (!b) return;
  const cat = CATALOGOS[actual];
  if (!b.dataset.masivo) { seleccion.clear(); pintarTabla(); return; }
  const ids = [...seleccion].map(Number);
  const etiqueta = cat.seleccion.opciones[b.dataset.masivo];
  if (ids.length > 20 && !confirm(`¿Cambiar ${ids.length} ${cat.titulo.toLowerCase()} a "${etiqueta}"?`)) return;
  $('barraSel').querySelectorAll('button').forEach(x => (x.disabled = true));
  const { error } = await sb.from(cat.tabla).update({ [cat.seleccion.campo]: b.dataset.masivo }).in('id', ids);
  if (error) { toast(traducirError(error), true); pintarBarraSel(cat); return; }
  toast(`${ids.length} ${ids.length === 1 ? cat.singular : cat.titulo.toLowerCase()} ${ids.length === 1 ? 'quedó' : 'quedaron'} como "${etiqueta}".`);
  seleccion.clear();
  await cargar(actual);
  mostrar(actual);
});

$('tablaWrap').addEventListener('change', e => {
  if (e.target.classList.contains('sel-fila')) {
    const id = e.target.closest('tr').dataset.id;
    e.target.checked ? seleccion.add(id) : seleccion.delete(id);
    pintarTabla();
  } else if (e.target.classList.contains('sel-todos')) {
    const ids = [...$('tablaWrap').querySelectorAll('tbody tr[data-id]')].map(tr => tr.dataset.id);
    ids.forEach(id => (e.target.checked ? seleccion.add(id) : seleccion.delete(id)));
    pintarTabla();
  }
});

function quitarFiltros() {
  delete filtrosCol[actual];
  pintarTabla();
}
$('btnQuitarFiltros').addEventListener('click', quitarFiltros);

/* ---------- Ventana de filtro de una columna ---------- */
let popCol = null;

function abrirPop(idx, boton) {
  const cat = CATALOGOS[actual];
  const c = cat.columnas[idx];
  popCol = { idx, boton };
  const base = filasFiltradas(cat, idx);
  const conteos = new Map();
  const claves = new Map();   // valor mostrado → valor real para ordenar (números, fechas)
  base.forEach(r => {
    const v = valorCol(c, r);
    conteos.set(v, (conteos.get(v) || 0) + 1);
    if (!claves.has(v)) claves.set(v, c.ord ? c.ord(r) : v);
  });
  const sel = (filtrosCol[actual] || {})[idx];
  if (sel) sel.forEach(v => { if (!conteos.has(v)) { conteos.set(v, 0); claves.set(v, v); } });
  const valores = [...conteos.keys()].sort((a, b) =>
    a === VACIO ? 1 : b === VACIO ? -1 : comparar(claves.get(a), claves.get(b)));
  const o = ordenCol[actual];

  const pop = $('pop');
  pop.innerHTML = `
    <div class="pop-ord">
      <button type="button" data-ord="1" aria-pressed="${!!(o && o.idx === idx && o.dir === 1)}"><span class="th-ico" aria-hidden="true">${ICONOS.asc}</span>Ordenar ascendente</button>
      <button type="button" data-ord="-1" aria-pressed="${!!(o && o.idx === idx && o.dir === -1)}"><span class="th-ico" aria-hidden="true">${ICONOS.desc}</span>Ordenar descendente</button>
    </div>
    <div class="pop-cuerpo">
      <input type="search" id="popBuscar" placeholder="Buscar en ${esc(c.t.toLowerCase())}" aria-label="Buscar valor">
      <label class="pop-op pop-todos"><input type="checkbox" id="popTodos"> (Seleccionar todo)</label>
      <div class="pop-lista" id="popLista">
        ${valores.map(v => `<label class="pop-op" data-v="${esc(v)}">
          <input type="checkbox" value="${esc(v)}" ${!sel || sel.has(v) ? 'checked' : ''}>
          <span>${esc(v)}</span><span class="n">${conteos.get(v)}</span></label>`).join('')}
      </div>
    </div>
    <div class="pop-pie">
      <button type="button" class="btn btn-sec btn-chico" id="popQuitar">Quitar filtro</button>
      <button type="button" class="btn btn-chico" id="popAplicar">Aplicar</button>
    </div>`;
  pop.hidden = false;

  const r = boton.getBoundingClientRect();
  const ancho = pop.offsetWidth;
  pop.style.left = `${Math.max(8, Math.min(r.left, innerWidth - ancho - 8))}px`;
  pop.style.top = `${r.bottom + 6}px`;
  pop.style.maxHeight = `${innerHeight - r.bottom - 16}px`;
  const lista = $('popLista');
  lista.style.maxHeight = `${Math.max(120, Math.min(240, innerHeight - r.bottom - 230))}px`;

  const visibles = () => [...lista.querySelectorAll('.pop-op')].filter(l => !l.hidden).map(l => l.querySelector('input'));
  const syncTodos = () => {
    const vis = visibles();
    const marcados = vis.filter(i => i.checked).length;
    $('popTodos').checked = vis.length > 0 && marcados === vis.length;
    $('popTodos').indeterminate = marcados > 0 && marcados < vis.length;
    $('popAplicar').disabled = !lista.querySelector('.pop-op:not([hidden]) input:checked');
  };
  syncTodos();

  $('popBuscar').addEventListener('input', e => {
    const t = e.target.value.trim().toLowerCase();
    lista.querySelectorAll('.pop-op').forEach(l => {
      l.hidden = !!t && !l.dataset.v.toLowerCase().includes(t);
      if (t) l.querySelector('input').checked = !l.hidden;   // como Excel: al buscar se marcan las coincidencias
    });
    syncTodos();
  });
  $('popTodos').addEventListener('change', e => { visibles().forEach(i => (i.checked = e.target.checked)); syncTodos(); });
  lista.addEventListener('change', syncTodos);

  pop.querySelectorAll('[data-ord]').forEach(b => b.addEventListener('click', () => {
    const dir = Number(b.dataset.ord);
    const actualOrd = ordenCol[actual];
    ordenCol[actual] = actualOrd && actualOrd.idx === idx && actualOrd.dir === dir ? null : { idx, dir };
    cerrarPop(); pintarTabla();
  }));
  $('popQuitar').addEventListener('click', () => {
    if (filtrosCol[actual]) delete filtrosCol[actual][idx];
    if (filtrosCol[actual] && !Object.keys(filtrosCol[actual]).length) delete filtrosCol[actual];
    cerrarPop(); pintarTabla();
  });
  $('popAplicar').addEventListener('click', () => {
    const buscando = !!$('popBuscar').value.trim();
    const elegidos = [...lista.querySelectorAll('.pop-op')]
      .filter(l => (!buscando || !l.hidden) && l.querySelector('input').checked)
      .map(l => l.dataset.v);
    filtrosCol[actual] = filtrosCol[actual] || {};
    if (elegidos.length === valores.length) delete filtrosCol[actual][idx];
    else filtrosCol[actual][idx] = new Set(elegidos);
    if (!Object.keys(filtrosCol[actual]).length) delete filtrosCol[actual];
    cerrarPop(); pintarTabla();
  });

  $('popBuscar').focus();
}

function cerrarPop(devolverFoco = false) {
  if ($('pop').hidden) return;
  $('pop').hidden = true;
  if (devolverFoco && popCol) {
    const b = $('tablaWrap').querySelector(`.th-btn[data-col="${popCol.idx}"]`);
    b?.focus();
  }
  popCol = null;
}

$('tablaWrap').addEventListener('click', e => {
  const b = e.target.closest('.th-btn');
  if (!b) return;
  e.stopPropagation();
  const idx = Number(b.dataset.col);
  if (popCol && popCol.idx === idx) { cerrarPop(); return; }
  abrirPop(idx, b);
});
document.addEventListener('mousedown', e => {
  if (!$('pop').hidden && !$('pop').contains(e.target) && !(e.target instanceof Element && e.target.closest('.th-btn'))) cerrarPop();
});
$('pop').addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.stopPropagation(); cerrarPop(true); }
  if (e.key === 'Enter' && e.target.id === 'popBuscar' && !$('popAplicar').disabled) $('popAplicar').click();
});
document.querySelector('main').addEventListener('scroll', () => cerrarPop());
window.addEventListener('resize', () => cerrarPop());

$('buscar').addEventListener('input', pintarTabla);
$('filtroEstado').addEventListener('change', pintarTabla);
$('btnNuevo').addEventListener('click', () => { const c = CATALOGOS[actual]; c.nuevoFn ? c.nuevoFn() : abrir(); });

$('tablaWrap').addEventListener('click', e => {
  if (e.target.closest('.col-sel')) return;
  const tr = e.target.closest('tr.editable');
  if (tr) { const reg = filasDe(actual).find(r => String(r.id) === tr.dataset.id); const c = CATALOGOS[actual]; c.verFn ? c.verFn(reg) : abrir(reg); }
});
$('tablaWrap').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.closest('.col-sel')) return;
  const tr = e.target.closest('tr.editable');
  if (tr) { const reg = filasDe(actual).find(r => String(r.id) === tr.dataset.id); const c = CATALOGOS[actual]; c.verFn ? c.verFn(reg) : abrir(reg); }
});

/* =========================================================
   7. FORMULARIO
   ========================================================= */
function htmlCampo(c, r) {
  const id = `f_${c.k}`;
  const ayuda = c.ayuda ? `<span class="ayuda" id="${id}_ayuda">${esc(c.ayuda)}</span>` : '';
  const err = `<span class="error" id="${id}_error" hidden></span>`;
  const req = c.req ? ' required' : '';
  const desc = c.ayuda ? ` aria-describedby="${id}_ayuda"` : '';
  const val = r[c.k];
  const ro = c.soloLectura || (c.soloLecturaEditar && r.id);

  if (c.tipo === 'check') {
    return `<div class="campo"><label class="opcion"><input type="checkbox" id="${id}" ${val ? 'checked' : ''}> ${esc(c.t)}</label></div>`;
  }
  if (c.tipo === 'control') {
    const actualCtrl = r.id ? controlDe(r) : 'SERIE';
    return `<fieldset class="campo"><legend>${esc(c.t)}</legend>
      ${Object.entries(CONTROLES).map(([k, o]) => `
        <label class="opcion"><input type="radio" name="control" value="${k}" ${k === actualCtrl ? 'checked' : ''}>
          <span>${esc(o.etiqueta)}<small>${esc(o.ayuda)}</small></span></label>`).join('')}
    </fieldset>`;
  }
  let input;
  if (c.tipo === 'select') {
    const ops = c.opciones(r);
    input = `<select id="${id}"${req}${desc}><option value="">${c.req ? 'Selecciona…' : 'Ninguno'}</option>
      ${ops.map(([v, t]) => `<option value="${esc(v)}" ${String(v) === String(val ?? '') ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
  } else if (c.tipo === 'buscador') {
    const ops = c.opciones(r);
    buscadorDatos[c.k] = ops;
    const sel = ops.find(o => String(o[0]) === String(val ?? ''));
    input = `<div class="buscador" data-k="${c.k}">
      <input type="hidden" id="${id}" value="${esc(val ?? '')}">
      <input type="text" id="${id}_txt" role="combobox" aria-expanded="false" aria-controls="${id}_ops" aria-autocomplete="list"
        autocomplete="off" placeholder="Buscar…" value="${esc(sel ? sel[1] : '')}"${desc}>
      <ul class="buscador-ops" id="${id}_ops" role="listbox" hidden></ul>
    </div>`;
  } else if (c.tipo === 'lista') {
    input = `<input type="text" id="${id}" list="${id}_lista" value="${esc(val ?? '')}" autocomplete="off"${req}${desc}>
      <datalist id="${id}_lista">${c.sugerencias().map(s => `<option value="${esc(s)}">`).join('')}</datalist>`;
  } else if (c.tipo === 'textarea' || c.tipo === 'specs') {
    const t = c.tipo === 'specs' ? specsATexto(val) : (val ?? '');
    input = `<textarea id="${id}"${desc}>${esc(t)}</textarea>`;
  } else {
    const type = { number: 'number', decimal: 'number', email: 'email', date: 'date' }[c.tipo] || 'text';
    const extra = c.tipo === 'number' ? ' min="0" step="1"' : c.tipo === 'decimal' ? ' min="0" step="0.01"' : '';
    const v = c.tipo === 'date' ? (val || '').slice(0, 10) : (val ?? '');
    input = `<input type="${type}" id="${id}" value="${esc(v)}"${req}${desc}${extra}${ro ? ' readonly' : ''}${c.mayus ? ' style="text-transform:uppercase"' : ''}>`;
  }
  return `<div class="campo" id="${id}_campo"><label for="${c.tipo === 'buscador' ? id + '_txt' : id}">${esc(c.t)}${c.req ? '' : ' <span style="font-weight:400;color:var(--muted)">(opcional)</span>'}</label>${input}${ayuda}${err}</div>`;
}

const buscadorDatos = {};
const sinAcentos = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

function iniciarBuscadores() {
  document.querySelectorAll('#panelCampos .buscador').forEach(caja => {
    const k = caja.dataset.k;
    const oculto = $(`f_${k}`), txt = $(`f_${k}_txt`), lista = $(`f_${k}_ops`);
    let activo = -1, visibles = [];
    const etiquetaSel = () => (buscadorDatos[k].find(o => String(o[0]) === oculto.value) || [])[1] || '';
    const cerrar = () => { lista.hidden = true; txt.setAttribute('aria-expanded', 'false'); txt.removeAttribute('aria-activedescendant'); };
    const pintar = () => {
      const q = sinAcentos(txt.value.trim());
      visibles = buscadorDatos[k].filter(o => !q || sinAcentos(o[1] + ' ' + (o[2] || '')).includes(q)).slice(0, 40);
      activo = visibles.length ? 0 : -1;
      lista.innerHTML = visibles.length
        ? visibles.map((o, i) => `<li role="option" id="f_${k}_op${i}" data-i="${i}" aria-selected="${i === activo}">${esc(o[1])}${o[2] ? `<small>${esc(o[2])}</small>` : ''}</li>`).join('')
        : `<li class="sin">${esc(caja.dataset.vacio || 'No hay coincidencias.')}</li>`;
      lista.hidden = false;
      txt.setAttribute('aria-expanded', 'true');
      if (activo >= 0) txt.setAttribute('aria-activedescendant', `f_${k}_op0`);
    };
    const marcar = i => {
      activo = i;
      lista.querySelectorAll('[role=option]').forEach((li, j) => li.setAttribute('aria-selected', j === i));
      const li = lista.querySelector(`[data-i="${i}"]`);
      if (li) { li.scrollIntoView?.({ block: 'nearest' }); txt.setAttribute('aria-activedescendant', li.id); }
    };
    const avisar = () => oculto.dispatchEvent(new Event('change', { bubbles: true }));
    const elegir = i => { const o = visibles[i]; if (!o) return; oculto.value = o[0]; txt.value = o[1]; cerrar(); avisar(); };

    txt.addEventListener('focus', () => { txt.select(); pintar(); });
    txt.addEventListener('input', () => { if (!txt.value.trim() && oculto.value) { oculto.value = ''; avisar(); } pintar(); });
    txt.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); if (lista.hidden) pintar(); else marcar(Math.min(activo + 1, visibles.length - 1)); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); marcar(Math.max(activo - 1, 0)); }
      else if (e.key === 'Enter' && !lista.hidden) { e.preventDefault(); elegir(activo); }
      else if (e.key === 'Escape' && !lista.hidden) { e.preventDefault(); e.stopPropagation(); txt.value = etiquetaSel(); cerrar(); }
    });
    lista.addEventListener('mousedown', e => {
      const li = e.target.closest('[data-i]');
      if (li) { e.preventDefault(); elegir(Number(li.dataset.i)); }
    });
    txt.addEventListener('blur', () => { cerrar(); txt.value = oculto.value ? etiquetaSel() : ''; });
  });
}

function abrir(registro) {
  modoPanel = 'edicion';
  $('btnGuardar').hidden = false;
  $('btnGuardar').textContent = 'Guardar';
  $('btnCancelar').textContent = 'Cancelar';
  const cat = CATALOGOS[actual];
  editando = registro || null;
  const r = registro || { activo: true, requiere_resguardo: true, dias_credito: 0, operador: 'TELCEL', estatus: 'ACTIVA', tipo_linea: 'TELEFONIA', condicion: 'SIN_DEFINIR', tipo_colaborador: 'COLABORADOR', ...(cat.porDefecto || {}) };
  $('panelTitulo').textContent = registro ? `Editar ${cat.singular}` : cat.nuevo;

  let html = cat.campos.map(c => htmlCampo(c, r)).join('');
  const esUnoMismo = actual === 'usuarios' && registro && registro.id === perfil.id;
  if (registro && !esUnoMismo && !cat.sinActivo) {
    html += `<div class="campo"><label class="opcion"><input type="checkbox" id="f_activo" ${r.activo ? 'checked' : ''}>
      <span>Activo<small>${esc(cat.ayudaActivo || 'Los registros inactivos no aparecen para nuevas altas, pero conservan su historial.')}</small></span></label></div>`;
  }

function marcarError(c, msg) {
  const campo = $(`f_${c.k}_campo`), e = $(`f_${c.k}_error`);
  if (!campo) return;
  campo.classList.toggle('invalido', !!msg);
  e.hidden = !msg; e.textContent = msg || '';
}

function leerFormulario(cat) {
  const payload = {};
  let valido = true;
  for (const c of cat.campos) {
    if (c.soloLectura) continue;
    if (c.tipo === 'control') {
      const ctrl = document.querySelector('input[name=control]:checked').value;
      payload.requiere_serie = ctrl === 'SERIE' || ctrl === 'IMEI';
      payload.requiere_imei = ctrl === 'IMEI';
      payload.es_consumible = ctrl === 'CANTIDAD';
      continue;
    }
    const el = $(`f_${c.k}`);
    if (c.tipo === 'check') { payload[c.k] = el.checked; continue; }
    if (el.disabled || el.readOnly) continue;
    if (c.tipo === 'specs') { payload[c.k] = textoASpecs(el.value); continue; }

    let v = el.value.trim();
    if (c.mayus) v = v.toUpperCase().replace(/\s+/g, c.k === 'rfc' ? '' : ' ');
    let msg = '';
    if (c.req && !v) msg = 'Este campo es obligatorio.';
    else if (v && c.patron && !c.patron.test(v)) msg = c.msgPatron;
    else if (v && c.tipo === 'email' && !el.checkValidity()) msg = 'Correo no válido.';
    marcarError(c, msg);
    if (msg) valido = false;

    if (c.tipo === 'number' || c.tipo === 'decimal' || c.num) payload[c.k] = v === '' ? (c.k === 'dias_credito' ? 0 : null) : Number(v);
    else payload[c.k] = v === '' ? null : v;
  }
  if (valido && cat.validar) {
    const extra = cat.validar(payload);
    Object.entries(extra).forEach(([k, msg]) => { marcarError({ k }, msg); valido = false; });
  }
  const act = $('f_activo');
  if (act) payload.activo = act.checked;
  else if (!editando && actual !== 'usuarios' && !cat.sinActivo) payload.activo = true;
  return valido ? payload : null;
}

$('formRegistro').addEventListener('submit', async e => {
  e.preventDefault();

});

async function leerArchivoCarga(e) {

  const m = file.name.match(/al_(\d{2})(\d{2})(\d{2})/i);

    $('cargaVista').innerHTML = `<div class="aviso">No se pudo leer el archivo: ${esc(err.message)}</div>`;

const normalizarEncabezado = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\*/g, '').trim();
function columnaDeEncabezado(t) {
  const n = normalizarEncabezado(t);
  if (n.startsWith('tipo')) return 'tipo';
  if (n.startsWith('puesto')) return 'puesto';
  if (n.startsWith('nombre')) return 'nombre';
  if (n.startsWith('apellido')) return 'apellidos';
  if (n.startsWith('num') || n.includes('empleado') && !n.startsWith('jefe')) return 'num_empleado';
  if (n.includes('centro')) return 'centro';
  if (n.startsWith('area')) return 'area';
  if (n.startsWith('jefe')) return 'jefe';
  if (n.startsWith('correo') || n.startsWith('email')) return 'email';
  if (n.includes('kore')) return 'usuario_kore';
  return null;
}

async function revisarCargaColab(e) {
  const file = e.target.files[0];
  cargaColab = null;
  $('btnGuardar').hidden = true;
  if (!file) return;
  const vista = $('colabVista');
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const nombreHoja = wb.SheetNames.find(n => normalizarEncabezado(n) === 'colaboradores') || wb.SheetNames[0];
    const matriz = XLSX.utils.sheet_to_json(wb.Sheets[nombreHoja], { header: 1, raw: false, defval: '' });
    const encabezados = (matriz[0] || []).map(columnaDeEncabezado);
    if (!encabezados.includes('nombre') || !encabezados.includes('apellidos')) {
      vista.innerHTML = '<div class="aviso">No reconozco este archivo. Usa el layout que descargas con el botón "Descargar layout" y no cambies los encabezados.</div>';
      return;
    }
    const filas = matriz.slice(1).map((arr, i) => {
      const o = { _fila: i + 2 };
      encabezados.forEach((k, j) => { if (k) o[k] = String(arr[j] ?? '').trim(); });
      return o;
    }).filter(o => Object.keys(o).some(k => k !== '_fila' && o[k]));
    if (!filas.length) { vista.innerHTML = '<div class="aviso">El layout no tiene renglones con datos.</div>'; return; }

    vista.innerHTML = '<p class="paso">Revisando…</p>';
    const { data, error } = await sb.rpc('importar_colaboradores', { p_filas: filas, p_aplicar: false });
    if (error) { vista.innerHTML = `<div class="aviso">${esc(traducirError(error))}</div>`; return; }

    const errores = data.errores || [];
    vista.innerHTML = `
      <div class="cifras">
        <div><strong>${data.total}</strong><span>renglones con datos</span></div>
        <div><strong>${errores.length}</strong><span>renglones con error</span></div>
        <div><strong>${data.nuevos}</strong><span>personas nuevas</span></div>
        <div><strong>${data.actualizados}</strong><span>ya existen (se actualizan)</span></div>
      </div>
      ${errores.length ? `
        <div class="aviso">Hay ${errores.length} ${errores.length === 1 ? 'renglón' : 'renglones'} con error. Corrige el archivo y vuelve a subirlo; no se guardó nada.</div>
        <ul class="lista-errores">${errores.slice(0, 100).map(x => `<li><strong>Renglón ${x.fila}:</strong> ${esc(x.mensaje)}</li>`).join('')}
          ${errores.length > 100 ? `<li>…y ${errores.length - 100} más.</li>` : ''}</ul>`
      : '<p class="paso">Todo está correcto. Confirma para guardar.</p>'}`;
    if (!errores.length) {
      cargaColab = filas;
      $('btnGuardar').textContent = `Cargar ${data.total} colaboradores`;
      $('btnGuardar').hidden = false;
    }
  } catch (err) {
    vista.innerHTML = `<div class="aviso">No se pudo leer el archivo: ${esc(err.message)}</div>`;
  }
}

   7d. COMPRAS: XML / REMISIÓN, PRORRATEO DE ENVÍO Y ARMADO
   ========================================================= */
let compra = null;
let pasoCompra = 1;
const r2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const aNum = v => { const n = Number(String(v ?? '').replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; };
const renglones = t => String(t || '').split(/[\n,;]+/).map(s => s.trim()).filter(Boolean);
const ROLES_CONCEPTO = { EQUIPO: 'Equipo o suministro', MATERIAL: 'Material para armar', ENVIO: 'Envío (se prorratea)', OMITIR: 'No registrar' };
const tipoPorId = id => aux.tiposFull.find(t => t.id === Number(id));
const esEntero = n => Number.isInteger(Number(n)) && Number(n) > 0;

function esEnvio(clave, desc) {
  return /^7810/.test(clave || '') || /(env[ií]o|flete|paqueter[ií]a|mensajer[ií]a|shipping|gastos de entrega|costo de entrega)/i.test(desc || '');
}
function esMaterial(desc) {
  return /(tarjeta madre|motherboard|mainboard|procesador|\bcpu\b|memoria|\bram\b|\bddr\d|\bdimm\b|disco|estado s[oó]lido|\bssd\b|\bhdd\b|\bnvme\b|\bm\.2\b|gabinete|fuente de (poder|alimentaci[oó]n)|tarjeta de video|tarjeta gr[aá]fica|\bgpu\b|disipador|ventilador|cooler|pasta t[eé]rmica|tarjeta de red|antena wi-?fi)/i.test(desc || '');
}
function detectarSeries(desc) {
  const res = [];
  const re = /(?:S\/N|\bSN\b|N[UÚ]M(?:ERO)?\.?\s*DE\s*SERIE|\bNO\.?\s*(?:DE\s*)?SERIE|\bSERIES?\b|\bSERIAL(?:ES)?\b)\s*[:#.\-]?\s*([A-Z0-9][A-Z0-9\-,;\/ ]{4,})/gi;
  let m;
  while ((m = re.exec(desc || ''))) {
    m[1].split(/[,;\/ ]+/).map(s => s.trim().toUpperCase())
      .filter(s => s.length >= 5 && /\d/.test(s) && /^[A-Z0-9\-]+$/.test(s))
      .forEach(s => { if (!res.includes(s)) res.push(s); });
  }
  return res;
}
function adivinar(lista, texto, campo = 'nombre') {
  const t = ' ' + sinAcentos(texto).replace(/[^a-z0-9]+/g, ' ') + ' ';
  const hit = lista.filter(x => x.activo !== false)
    .map(x => ({ x, n: sinAcentos(x[campo]).replace(/[^a-z0-9]+/g, ' ').trim() }))
    .filter(o => o.n.length >= 2 && t.includes(' ' + o.n + ' '))
    .sort((a, b) => b.n.length - a.n.length)[0];
  return hit ? String(hit.x.id) : '';
}
function conceptoNuevo(i, datos) {
  const desc = datos.descripcion || '';
  const tipo_id = adivinar(aux.tiposFull, desc);
  const marca_id = adivinar(aux.marcas, desc);
  const modelo_id = adivinar(aux.modelos.filter(m => !marca_id || String(m.marca_id) === marca_id), desc);
  return {
    i, clave: '', noIdent: '', unidad: '', cantidad: 1, importe: 0, descuento: 0, iva: 0, vu: 0, pct: 16,
    rol: 'EQUIPO', series: '', imeis: '', despues: false, centro_costo_id: '', precio_empleado: '',
    tipo_id, marca_id, modelo_id, ...datos,
  };
}

function leerCFDI(texto) {
  const doc = new DOMParser().parseFromString(texto, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('El archivo no es un XML válido.');
  const uno = (padre, nombre) => padre.getElementsByTagNameNS('*', nombre)[0];
  const comp = uno(doc, 'Comprobante');
  if (!comp) throw new Error('El XML no es una factura CFDI.');
  const tipo = comp.getAttribute('TipoDeComprobante');
  if (tipo && tipo !== 'I') throw new Error(`Este CFDI es de tipo "${tipo}". Solo se cargan facturas de ingreso (tipo I).`);
  const timbre = uno(doc, 'TimbreFiscalDigital');
  if (!timbre) throw new Error('El XML no está timbrado (no tiene folio fiscal UUID).');
  const emisor = uno(comp, 'Emisor'), receptor = uno(comp, 'Receptor');
  const moneda = comp.getAttribute('Moneda') || 'MXN';
  const tc = aNum(comp.getAttribute('TipoCambio')) || 1;
  const f = moneda === 'MXN' || moneda === 'XXX' ? 1 : tc;
  const nodoConceptos = uno(comp, 'Conceptos');
  const conceptos = [...(nodoConceptos?.children || [])].filter(n => n.localName === 'Concepto').map((n, i) => {
    const iva = [...n.getElementsByTagNameNS('*', 'Traslado')]
      .filter(t => t.getAttribute('Impuesto') === '002').reduce((s, t) => s + aNum(t.getAttribute('Importe')), 0);
    const descripcion = n.getAttribute('Descripcion') || '';
    const clave = n.getAttribute('ClaveProdServ') || '';
    const c = conceptoNuevo(i, {
      clave, descripcion, noIdent: n.getAttribute('NoIdentificacion') || '',
      unidad: n.getAttribute('Unidad') || n.getAttribute('ClaveUnidad') || '',
      cantidad: aNum(n.getAttribute('Cantidad')), importe: aNum(n.getAttribute('Importe')) * f,
      descuento: aNum(n.getAttribute('Descuento')) * f, iva: iva * f,
      series: detectarSeries(descripcion).join('\n'),
    });
    c.rol = esEnvio(clave, descripcion) ? 'ENVIO' : esMaterial(descripcion) ? 'MATERIAL' : 'EQUIPO';
    return c;
  });
  if (!conceptos.length) throw new Error('El XML no tiene conceptos.');
  const rfc = (emisor?.getAttribute('Rfc') || '').toUpperCase();
  const prov = aux.proveedores.find(p => p.rfc === rfc);
  return {
    origen: 'XML', xml: texto,
    proveedor: { rfc, razon_social: emisor?.getAttribute('Nombre') || '', regimen: emisor?.getAttribute('RegimenFiscal') || '' },
    proveedor_id: prov ? String(prov.id) : '', proveedorNombre: prov?.razon_social || '',
    receptor: { rfc: receptor?.getAttribute('Rfc') || '', nombre: receptor?.getAttribute('Nombre') || '' },
    folio: [comp.getAttribute('Serie'), comp.getAttribute('Folio')].filter(Boolean).join('-'),
    uuid: (timbre.getAttribute('UUID') || '').toUpperCase(),
    fecha: (comp.getAttribute('Fecha') || '').slice(0, 10),
    moneda, tipo_cambio: f,
    subtotal: aNum(comp.getAttribute('SubTotal')) * f, descuento: aNum(comp.getAttribute('Descuento')) * f,
    total: aNum(comp.getAttribute('Total')) * f,
    conceptos,
  };
}

function nuevoArmado() {
  return { si: null, n: 1, tipo_id: '', marca_id: '', modelo_id: '', descripcion: '', series: '', imeis: '', despues: false,

const PASOS = ['Archivo', 'Conceptos', 'Armado', 'Confirmar'];
function hayMateriales() { return compra?.conceptos.some(c => c.rol === 'MATERIAL'); }
// Se puede armar con cualquier concepto que no vaya pieza por pieza con serie
function usables() {
  return compra.conceptos.filter(c => c.rol === 'MATERIAL' || (c.rol === 'EQUIPO' && !tipoPorId(c.tipo_id)?.requiere_serie));
}
const usadoEnArmado = c => compra.armar.si ? aNum(compra.armar.n) * aNum(compra.armar.por[c.i]) : 0;

function calcularCompra() {
  const cs = compra.conceptos;
  cs.forEach(c => {
    if (compra.origen === 'REMISION') { c.importe = aNum(c.cantidad) * aNum(c.vu); c.iva = c.importe * aNum(c.pct) / 100; }
  });
  const neto = c => Math.max(0, c.importe - c.descuento);
  const base = cs.filter(c => c.rol === 'EQUIPO' || c.rol === 'MATERIAL');
  const env = cs.filter(c => c.rol === 'ENVIO');
  const envioSin = env.reduce((s, c) => s + neto(c), 0);
  const envioIva = env.reduce((s, c) => s + c.iva, 0);
  const sumBase = base.reduce((s, c) => s + neto(c), 0);
  cs.forEach(c => { c.unitSin = null; c.unitCon = null; c.parteEnvio = 0; });
  base.forEach(c => {
    const prop = sumBase > 0 ? neto(c) / sumBase : 0;
    const cant = aNum(c.cantidad) || 1;
    c.parteEnvio = envioSin * prop;
    c.unitSin = (neto(c) + envioSin * prop) / cant;
    c.unitCon = (neto(c) + c.iva + (envioSin + envioIva) * prop) / cant;
  });
  const a = compra.armar;
  a.costoSin = 0; a.costoCon = 0;
  usables().forEach(c => {
    const p = aNum(a.por[c.i]);
    a.costoSin += p * (c.unitSin || 0);
    a.costoCon += p * (c.unitCon || 0);
  });
  const totSin = base.reduce((s, c) => s + neto(c), 0) + envioSin;
  const totCon = totSin + base.reduce((s, c) => s + c.iva, 0) + envioIva;
  compra.calc = { envioSin, envioIva, sumBase, totSin, totCon,
    omitido: cs.filter(c => c.rol === 'OMITIR').reduce((s, c) => s + neto(c) + c.iva, 0) };
  if (compra.origen === 'REMISION') {
    compra.subtotal = cs.reduce((s, c) => s + c.importe, 0);
    compra.descuento = 0;
    compra.total = cs.reduce((s, c) => s + c.importe + c.iva, 0);
  }
  compra.iva = cs.reduce((s, c) => s + c.iva, 0);
}

const opcionesHTML = (lista, valor, vacio) =>
  `<option value="">${esc(vacio)}</option>` + lista.map(([v, t]) => `<option value="${esc(v)}" ${String(v) === String(valor ?? '') ? 'selected' : ''}>${esc(t)}</option>`).join('');
const optTipos = () => aux.tiposFull.filter(t => t.activo).map(t => [t.id, `${t.nombre} · ${CATEGORIAS[t.categoria] || ''}`]);
const optMarcas = () => aux.marcas.map(m => [m.id, m.nombre]);
const optModelos = (marca, tipo) => aux.modelos.filter(m => m.activo && (!marca || String(m.marca_id) === String(marca)) && (!tipo || String(m.tipo_id) === String(tipo)))
  .map(m => [m.id, marca ? m.nombre : `${m.marca} ${m.nombre}`]);
const optCentros = () => aux.centros.filter(c => c.activo).map(c => [c.id, `${c.clave} ${c.nombre}`]);

function campoSel(attrs, etiqueta, opciones, valor, vacio, ayuda) {
  return `<label class="campo"><span class="etq">${esc(etiqueta)}</span><select ${attrs}>${opcionesHTML(opciones, valor, vacio)}</select>${ayuda ? `<span class="ayuda">${esc(ayuda)}</span>` : ''}</label>`;
}
function campoTxt(attrs, etiqueta, valor, extra = '') {
  return `<label class="campo"><span class="etq">${esc(etiqueta)}</span><input ${attrs} value="${esc(valor ?? '')}" ${extra}></label>`;
}

function pintarCompra(errores = []) {
  const cuerpo = $('panelCampos');
  const scroll = cuerpo.parentElement.scrollTop;
  const pasos = PASOS.map((p, i) =>
    `<span class="${i + 1 === pasoCompra ? 'actual' : ''}">${i + 1}. ${p}</span>`).join('');
  $('panelTitulo').textContent = compra?.origen === 'REMISION' ? 'Registrar remisión' : 'Cargar factura XML';
  let html = `<div class="pasos">${pasos}</div>`;
  if (errores.length) html += `<div class="aviso">Revisa lo siguiente antes de continuar:</div>
    <ul class="lista-errores" style="margin-bottom:1rem">${errores.map(e => `<li>${esc(e)}</li>`).join('')}</ul>`;

  if (pasoCompra === 1) html += pasoArchivo();
  else { calcularCompra(); html += pasoCompra === 2 ? pasoConceptos() : pasoCompra === 3 ? pasoArmado() : pasoResumen(); }

  cuerpo.innerHTML = html;
  cuerpo.parentElement.scrollTop = errores.length ? 0 : scroll;
  $('btnAtras').hidden = pasoCompra <= (compra?.origen === 'REMISION' ? 2 : 1) || pasoCompra === 1;
  $('btnGuardar').hidden = pasoCompra === 1;
  $('btnGuardar').textContent = pasoCompra === 4 ? 'Guardar compra' : 'Siguiente';
  if (pasoCompra === 1) $('xmlArchivo').addEventListener('change', leerArchivoXML);
  else pintarCalculosCompra();
}

function pasoArchivo() {
  return `<p class="paso">Sube la factura en XML. Leo el proveedor, el folio fiscal y cada concepto; los envíos se reparten entre los equipos.</p>
    <div class="zona-archivo"><input type="file" id="xmlArchivo" accept=".xml" aria-label="Factura XML"></div>
    <div id="xmlAviso"></div>`;
}

async function leerArchivoXML(e) {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const c = leerCFDI(await file.text());
    c.archivo = file.name;
    if ((datos.compras || []).some(x => (x.uuid || '').toUpperCase() === c.uuid)) throw new Error(`Esta factura (UUID ${c.uuid}) ya se cargó antes.`);
    c.armar = nuevoArmado();
    c.centro_costo_id = '';
    compra = c;
    pasoCompra = 2;
    pintarCompra();
  } catch (err) {
    $('xmlAviso').innerHTML = `<div class="aviso">${esc(err.message)}</div>`;
  }
}

  const rem = compra.origen === 'REMISION';
  const encabezado = rem
    ? `<div class="rejilla" style="flex:1">
        ${campoTxt(`type="text" data-c="${c.i}" data-f="descripcion"`, 'Descripción *', c.descripcion)}
        ${campoTxt(`type="number" min="0" step="1" data-c="${c.i}" data-f="cantidad"`, 'Cantidad *', c.cantidad)}
        ${campoTxt(`type="number" min="0" step="0.01" data-c="${c.i}" data-f="vu"`, 'Precio unitario sin IVA *', c.vu)}
        ${campoTxt(`type="number" min="0" step="1" data-c="${c.i}" data-f="pct"`, '% IVA', c.pct)}
      </div>`
    : `<div><strong>${esc(c.descripcion)}</strong>
        <small>${c.clave ? `Clave SAT ${esc(c.clave)} · ` : ''}${c.cantidad} ${esc(c.unidad)} · Importe ${fmtMoneda(c.importe - c.descuento)}${c.descuento ? ` (desc. ${fmtMoneda(c.descuento)})` : ''} · IVA ${fmtMoneda(c.iva)}</small></div>`;
  let cuerpo = '';
  if (esBase) {
    cuerpo += `<div class="rejilla">
      ${campoSel(`data-c="${c.i}" data-f="tipo_id"`, 'Tipo *', optTipos(), c.tipo_id, 'Selecciona…')}
      ${campoSel(`data-c="${c.i}" data-f="marca_id"`, 'Marca', optMarcas(), c.marca_id, 'Sin marca')}
      ${campoSel(`data-c="${c.i}" data-f="modelo_id"`, 'Modelo', optModelos(c.marca_id, c.tipo_id), c.modelo_id, 'Sin modelo')}
      ${campoSel(`data-c="${c.i}" data-f="centro_costo_id"`, 'Centro de costo', optCentros(), c.centro_costo_id, 'Igual que la compra')}
      ${c.rol === 'EQUIPO' ? campoTxt(`type="number" min="0" step="0.01" data-c="${c.i}" data-f="precio_empleado"`, 'Precio empleado (c/u)', c.precio_empleado) : ''}
    </div>`;
    if (c.rol === 'EQUIPO' && porPieza(t) && !t.requiere_serie) {
      cuerpo += `<div class="rejilla" style="margin-top:.6rem">
        <label class="campo"><span class="etq">Números de serie (opcional) <span class="ayuda" data-calc="nser-${c.i}"></span></span>
          <textarea data-c="${c.i}" data-f="series" placeholder="Si las piezas traen serie, una por renglón">${esc(c.series)}</textarea></label>
      </div>
      <p class="nota" style="margin:.4rem 0 0">Se registra un renglón por pieza (${aNum(c.cantidad)}).</p>`;
    }
    if (c.rol === 'EQUIPO' && t?.requiere_serie) {
      cuerpo += `<div class="rejilla" style="margin-top:.6rem">
        <label class="campo"><span class="etq">Números de serie <span class="ayuda" data-calc="nser-${c.i}"></span></span>
          <textarea data-c="${c.i}" data-f="series" placeholder="Una serie por renglón">${esc(c.series)}</textarea></label>
        ${t.requiere_imei ? `<label class="campo"><span class="etq">IMEI <span class="ayuda" data-calc="nimei-${c.i}"></span></span>
          <textarea data-c="${c.i}" data-f="imeis" placeholder="Un IMEI de 15 dígitos por renglón">${esc(c.imeis)}</textarea></label>` : ''}
      </div>
      <label class="opcion"><input type="checkbox" data-c="${c.i}" data-f="despues" ${c.despues ? 'checked' : ''}>
        <span>Capturar ${t.requiere_imei ? 'series e IMEI' : 'series'} después<small>Se dan de alta sin ese dato y lo completas editando cada equipo.</small></span></label>`;
    }
    if (c.rol === 'MATERIAL') cuerpo += `<p class="nota" style="margin:.6rem 0 0">En el siguiente paso decides cuántos usar para armar equipos. Lo que sobre queda en stock.</p>`;
    cuerpo += `<p class="costo-linea" data-calc="costo-${c.i}"></p>`;
  } else if (c.rol === 'ENVIO') cuerpo = '<p class="nota" style="margin:0">Se reparte entre los equipos y materiales de esta compra, en proporción a su costo.</p>';
  else cuerpo = '<p class="nota" style="margin:0">No se registra ni se reparte. Úsalo para garantías o servicios que no son equipo.</p>';

  return `<article class="concepto rol-${c.rol}">
    <header class="concepto-cab">${encabezado}
      <div class="concepto-acciones">

      </div>
    </header>
    <div class="concepto-cuerpo">${cuerpo}</div>
  </article>`;
}

      ${campoSel('data-a="modelo_id"', 'Modelo', optModelos(a.marca_id, a.tipo_id), a.modelo_id, 'Sin modelo')}
      ${campoTxt('type="text" data-a="descripcion"', 'Descripción', a.descripcion, 'placeholder="Ej. PC armada i5 16 GB"')}
      ${campoSel('data-a="centro_costo_id"', 'Centro de costo', optCentros(), a.centro_costo_id, 'Igual que la compra')}
      ${campoTxt('type="number" min="0" step="0.01" data-a="precio_empleado"', 'Precio empleado (c/u)', a.precio_empleado)}
    </div>
    <h3 style="margin:1.25rem 0 .5rem;font-size:1rem">Materiales que lleva cada equipo</h3>
    <div class="tabla-wrap"><table>

      <tbody>${mats.map(c => `<tr>
        <td>${esc(c.descripcion)}</td><td class="mono">${c.cantidad}</td>
        <td><input type="number" min="0" step="1" style="width:6rem" data-a="por" data-m="${c.i}" value="${esc(a.por[c.i] ?? '')}" aria-label="Cantidad por equipo de ${esc(c.descripcion)}"></td>
        <td class="mono" data-calc="usa-${c.i}"></td><td class="mono" data-calc="sobra-${c.i}"></td>

    ${conSerie.length ? `<p class="nota" style="margin:.6rem 0 0">No aparecen aquí ${conSerie.map(c => `"${esc(c.descripcion.slice(0, 40))}"`).join(', ')} porque su tipo se controla por número de serie. Si son piezas para armar, regresa y márcalos como "Material para armar".</p>` : ''}
    ${t?.requiere_serie ? `<div class="rejilla" style="margin-top:1rem">

      <div><span>Costo de cada equipo con IVA</span><strong data-calc="a-con"></strong></div>

}

function construirPayload() {
  const k = compra, a = k.armar;
  const centro = c => Number(c.centro_costo_id || k.centro_costo_id);
  const equipos = [];
  k.conceptos.forEach(c => {
    const base = {
      tipo_id: Number(c.tipo_id), marca_id: c.marca_id || null, modelo_id: c.modelo_id || null,
      descripcion: c.descripcion, centro_costo_id: centro(c),
      costo_sin_iva: r2(c.unitSin), costo_con_iva: r2(c.unitCon),
    };
    if (c.rol === 'EQUIPO') {
      const t = tipoPorId(c.tipo_id);
      base.precio_empleado = c.precio_empleado === '' ? null : aNum(c.precio_empleado);
      if (porPieza(t)) {
        const s = renglones(c.series), im = renglones(c.imeis);
        const piezas = aNum(c.cantidad) - (t.requiere_serie ? 0 : usadoEnArmado(c));
        for (let j = 0; j < piezas; j++)
          equipos.push({ ...base, cantidad: 1, num_serie: s[j] || null, imei: t.requiere_imei ? (im[j] || null) : null });
      } else {
        const quedan = aNum(c.cantidad) - usadoEnArmado(c);
        if (quedan > 0) equipos.push({ ...base, cantidad: quedan });
      }
    } else if (c.rol === 'MATERIAL') {
      const sobra = aNum(c.cantidad) - usadoEnArmado(c);
      if (sobra > 0) equipos.push({ ...base, cantidad: sobra, es_material: true });
    }
  });
  const armados = [];
  if (a.si) {
    const t = tipoPorId(a.tipo_id);
    const s = renglones(a.series), im = renglones(a.imeis);
    const componentes = usables().filter(c => aNum(a.por[c.i]) > 0).map(c => ({
      descripcion: c.descripcion, tipo_id: c.tipo_id || null, marca_id: c.marca_id || null, cantidad: aNum(a.por[c.i]),
      costo_unit_sin_iva: Math.round(c.unitSin * 10000) / 10000, costo_unit_con_iva: Math.round(c.unitCon * 10000) / 10000,
    }));
    for (let j = 0; j < aNum(a.n); j++) armados.push({
      tipo_id: Number(a.tipo_id), marca_id: a.marca_id || null, modelo_id: a.modelo_id || null,
      descripcion: a.descripcion || `${t?.nombre || 'Equipo'} armado`,
      num_serie: t?.requiere_serie ? (s[j] || null) : null, imei: t?.requiere_imei ? (im[j] || null) : null,
      centro_costo_id: Number(a.centro_costo_id || k.centro_costo_id),
      costo_sin_iva: r2(a.costoSin), costo_con_iva: r2(a.costoCon),
      precio_empleado: a.precio_empleado === '' ? null : aNum(a.precio_empleado), componentes,
    });
  }
  return {
    origen: k.origen, proveedor_id: k.proveedor_id || null, proveedor: k.proveedor || null,
    folio: k.folio, uuid: k.uuid || null, fecha: k.fecha, moneda: k.moneda, tipo_cambio: k.tipo_cambio,
    subtotal: r2(k.subtotal), descuento: r2(k.descuento || 0), iva: r2(k.iva), total: r2(k.total), envio: r2(k.calc.envioSin),
    xml: k.xml || null, archivo: k.archivo || null, equipos, armados,
  };
}

    ${compra.armar.si ? `<p class="paso"><strong>Se usan para armar:</strong> ${usables().filter(c => usadoEnArmado(c) > 0)

function validarPaso() {
  const k = compra, err = [];
  if (pasoCompra === 2) {
    if (!k.centro_costo_id) err.push('Elige el centro de costo de la compra.');
    if (k.origen === 'REMISION') {
      if (!k.proveedor_id) err.push('Elige el proveedor.');
      if (!k.fecha) err.push('Indica la fecha.');
    }
    const base = k.conceptos.filter(c => c.rol === 'EQUIPO' || c.rol === 'MATERIAL');
    if (!base.length) err.push('Al menos un concepto debe ser equipo, suministro o material.');
    const todasSeries = [], todosImei = [];
    k.conceptos.forEach((c, n) => {
      const nom = `"${(c.descripcion || `Renglón ${n + 1}`).slice(0, 50)}"`;
      if (k.origen === 'REMISION') {
        if (!c.descripcion.trim()) err.push(`Renglón ${n + 1}: falta la descripción.`);
        if (!(aNum(c.cantidad) > 0)) err.push(`${nom}: la cantidad debe ser mayor a cero.`);
        if (c.rol !== 'OMITIR' && !(aNum(c.vu) > 0)) err.push(`${nom}: falta el precio unitario.`);
      }
      if (c.rol !== 'EQUIPO' && c.rol !== 'MATERIAL') return;
      const t = tipoPorId(c.tipo_id);
      if (!t) { err.push(`${nom}: elige el tipo.`); return; }
      if (!esEntero(c.cantidad)) err.push(`${nom}: la cantidad (${c.cantidad}) debe ser un número entero para registrarla en inventario.`);
      if (c.rol === 'EQUIPO' && porPieza(t) && !t.requiere_serie) {
        const s = renglones(c.series);
        if (s.length > aNum(c.cantidad)) err.push(`${nom}: hay más series (${s.length}) que piezas (${c.cantidad}).`);
        todasSeries.push(...s.map(x => x.toUpperCase()));
      }
      if (c.rol === 'EQUIPO' && t.requiere_serie) {
        const s = renglones(c.series), im = renglones(c.imeis);
        if (!c.despues && s.length !== aNum(c.cantidad)) err.push(`${nom}: capturaste ${s.length} series y son ${c.cantidad} piezas.`);
        if (c.despues && s.length > aNum(c.cantidad)) err.push(`${nom}: hay más series (${s.length}) que piezas (${c.cantidad}).`);
        if (t.requiere_imei) {
          if (!c.despues && im.length !== aNum(c.cantidad)) err.push(`${nom}: capturaste ${im.length} IMEI y son ${c.cantidad} piezas.`);
          im.filter(x => !/^\d{15}$/.test(x)).forEach(x => err.push(`${nom}: el IMEI ${x} no tiene 15 dígitos.`));
          todosImei.push(...im);
        }
        todasSeries.push(...s.map(x => x.toUpperCase()));
      }
    });
    const dup = l => [...new Set(l.filter((x, i) => l.indexOf(x) !== i))];
    dup(todasSeries).forEach(x => err.push(`La serie ${x} está repetida en esta compra.`));
    dup(todosImei).forEach(x => err.push(`El IMEI ${x} está repetido en esta compra.`));
    const existentes = new Set((datos.equipos || []).map(e => (e.num_serie || '').toUpperCase()).filter(Boolean));
    todasSeries.filter(x => existentes.has(x)).forEach(x => err.push(`La serie ${x} ya existe en el inventario.`));
  }
  if (pasoCompra === 3) {
    const a = k.armar;
    if (a.si === null) err.push('Indica si deseas armar equipos.');
    if (a.si) {
      if (!esEntero(a.n)) err.push('Indica cuántos equipos vas a armar.');
      const t = tipoPorId(a.tipo_id);
      if (!t) err.push('Elige el tipo de equipo resultante.');
      const mats = usables();
      if (!mats.some(c => aNum(a.por[c.i]) > 0)) err.push('Indica qué materiales lleva cada equipo.');
      mats.forEach(c => {
        const p = a.por[c.i];
        if (p !== undefined && p !== '' && !(Number.isInteger(Number(p)) && Number(p) >= 0)) err.push(`"${c.descripcion.slice(0, 50)}": la cantidad por equipo debe ser entera.`);
        else if (aNum(a.n) * aNum(p) > aNum(c.cantidad)) err.push(`"${c.descripcion.slice(0, 50)}": se necesitan ${aNum(a.n) * aNum(p)} y solo hay ${c.cantidad}.`);
      });
      if (t?.requiere_serie && !a.despues && renglones(a.series).length !== aNum(a.n))
        err.push(`Capturaste ${renglones(a.series).length} series para ${a.n} equipos armados.`);
    }
  }
  return err;
}

async function avanzarCompra() {

/* ---------- Número a letras (para los importes del documento) ---------- */
function numeroALetras(n) {
  const U = ['', 'UNO', 'DOS', 'TRES', 'CUATRO', 'CINCO', 'SEIS', 'SIETE', 'OCHO', 'NUEVE', 'DIEZ', 'ONCE', 'DOCE', 'TRECE', 'CATORCE',
    'QUINCE', 'DIECISÉIS', 'DIECISIETE', 'DIECIOCHO', 'DIECINUEVE', 'VEINTE', 'VEINTIUNO', 'VEINTIDÓS', 'VEINTITRÉS', 'VEINTICUATRO',
    'VEINTICINCO', 'VEINTISÉIS', 'VEINTISIETE', 'VEINTIOCHO', 'VEINTINUEVE'];
  const D = ['', '', '', 'TREINTA', 'CUARENTA', 'CINCUENTA', 'SESENTA', 'SETENTA', 'OCHENTA', 'NOVENTA'];
  const C = ['', 'CIENTO', 'DOSCIENTOS', 'TRESCIENTOS', 'CUATROCIENTOS', 'QUINIENTOS', 'SEISCIENTOS', 'SETECIENTOS', 'OCHOCIENTOS', 'NOVECIENTOS'];
  const menorMil = x => {
    if (x === 100) return 'CIEN';
    const c = Math.floor(x / 100), r = x % 100;
    const dec = r < 30 ? U[r] : D[Math.floor(r / 10)] + (r % 10 ? ' Y ' + U[r % 10] : '');
    return [C[c], dec].filter(Boolean).join(' ');
  };
  const entero = x => {
    if (x === 0) return 'CERO';
    const mill = Math.floor(x / 1e6), miles = Math.floor((x % 1e6) / 1000), resto = x % 1000;
    const partes = [];
    if (mill) partes.push(mill === 1 ? 'UN MILLÓN' : entero(mill).replace(/VEINTIUNO$/, 'VEINTIÚN').replace(/UNO$/, 'UN') + ' MILLONES');
    if (miles) partes.push(miles === 1 ? 'MIL' : menorMil(miles).replace(/VEINTIUNO$/, 'VEINTIÚN').replace(/UNO$/, 'UN') + ' MIL');
    if (resto) partes.push(menorMil(resto));
    return partes.join(' ');
  };
  return entero(Math.floor(n));
}
const pesosEnLetra = n => {
  const v = Math.round(Number(n || 0) * 100) / 100;
  const cent = Math.round((v - Math.floor(v)) * 100);
  const ent = Math.floor(v);
  return `${numeroALetras(ent).replace(/VEINTIUNO$/, 'VEINTIÚN').replace(/UNO$/, 'UN')} ${ent === 1 ? 'PESO' : 'PESOS'} ${String(cent).padStart(2, '0')}/100 M.N.`;
};
