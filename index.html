  return `<div class="campo"><label class="etq" for="f_${k}_txt">${esc(etiqueta)}</label>
    <div class="buscador" data-k="${k}" data-vacio="${esc(vacio)}">
      <input type="hidden" id="f_${k}" data-r="${k}" value="${esc(valor ?? '')}">
      <input type="text" id="f_${k}_txt" role="combobox" aria-expanded="false" aria-controls="f_${k}_ops" aria-autocomplete="list"
        autocomplete="off" placeholder="Buscar…" value="${esc(sel ? sel[1] : '')}">
      <ul class="buscador-ops" id="f_${k}_ops" role="listbox" hidden></ul>
    </div>${ayuda ? `<span class="ayuda">${esc(ayuda)}</span>` : ''}</div>`;
}
const rTxt = (k, etiqueta, extra = '') => `<label class="campo"><span class="etq">${esc(etiqueta)}</span><input data-r="${k}" value="${esc(res[k] ?? '')}" ${extra}></label>`;
const rArea = (k, etiqueta, ph = '') => `<label class="campo"><span class="etq">${esc(etiqueta)}</span><textarea data-r="${k}" placeholder="${esc(ph)}" style="min-height:3.5rem">${esc(res[k] ?? '')}</textarea></label>`;

function pintarResguardo(errores = []) {
  const cuerpo = $('panelCampos');
  const scroll = cuerpo.parentElement.scrollTop;
  const colab = (datos.colaboradores || []).find(c => String(c.id) === String(res.colaborador_id));
  const jefe = colab?.jefe_id ? aux.colaboradores.find(x => x.id === colab.jefe_id) : null;
  const cel = (datos.equipos || []).find(e => String(e.id) === String(res.equipo_id));
  const lin = (datos.lineas || []).find(l => String(l.id) === String(res.linea_id));
  const ren = sumarMeses(res.fecha_entrega, res.plazo_meses);
  const opsColab = (datos.colaboradores || []).filter(c => c.activo)
    .map(c => [c.id, nombreDe(c), [c.puesto, c.area, c.num_empleado && `Núm. ${c.num_empleado}`].filter(Boolean).join(' · ')]);
  const opsLin = lineasDisponibles().map(l => [l.id, l.telefono, [l.plan, l.condicion !== 'DISPONIBLE' ? `marcada ${CONDICION_LINEA[l.condicion].toLowerCase()}` : ''].filter(Boolean).join(' · ')]);
  const opsCel = celularesDisponibles().map(e => [e.id, celularTexto(e),
    [e.imei && `IMEI ${e.imei}`, e.num_serie && `Serie ${e.num_serie}`, e.precio_empleado && `Precio empleado ${fmtMoneda(e.precio_empleado)}`,
     e.condicion !== 'DISPONIBLE' ? `marcado ${CONDICION_EQUIPO[e.condicion].toLowerCase()}` : ''].filter(Boolean).join(' · ')]);

  let html = errores.length ? `<div class="aviso">Revisa lo siguiente:</div>
    <ul class="lista-errores" style="margin-bottom:1rem">${errores.map(e => `<li>${esc(e)}</li>`).join('')}</ul>` : '';

  html += `<fieldset class="campo"><legend>Tipo de resguardo</legend><div class="rejilla">
    ${Object.entries(TIPOS_RESGUARDO).map(([k, o]) => `<label class="opcion tarjeta-op${res.tipo === k ? ' activa' : ''}">
      <input type="radio" name="resTipo" data-r="tipo" value="${k}" ${res.tipo === k ? 'checked' : ''}>
      <span><strong>${esc(o.t)}</strong><small>${esc(o.d)}</small></span></label>`).join('')}
  </div></fieldset>`;

  html += `<div class="rejilla">${buscadorHTML('colaborador_id', 'Colaborador *', opsColab, res.colaborador_id, 'No hay colaboradores activos que coincidan.')}</div>`;
  if (colab) {
    const faltan = [!colab.puesto && 'puesto', !colab.num_empleado && 'número de empleado'].filter(Boolean);
    html += `<dl class="compra-cab" style="margin-top:.6rem">
      <div><dt>Puesto</dt><dd>${esc(colab.puesto || '—')}</dd></div>
      <div><dt>Área</dt><dd>${esc(colab.area || '—')}</dd></div>
      <div><dt>Centro de costo</dt><dd>${esc(colab.centros_costo ? `${colab.centros_costo.clave} ${colab.centros_costo.nombre}` : '—')}</dd></div>
      <div><dt>Jefe directo</dt><dd>${esc(jefe ? nombreDe(jefe) : '—')}</dd></div>
    </dl>${faltan.length ? `<p class="nota">Al colaborador le falta ${faltan.join(' y ')}; el documento lo dejará en blanco. Puedes completarlo en Colaboradores.</p>` : ''}`;
  }

  const soloLinea = res.tipo === 'LINEA';
  html += `<div class="rejilla" style="margin-top:1rem">
    ${buscadorHTML('linea_id', `Línea${soloLinea || res.tipo === 'MONITOREADO' ? ' *' : ''}`, opsLin, res.linea_id, 'No hay líneas disponibles que coincidan.', 'Solo líneas de telefonía activas y sin resguardo.')}
    ${soloLinea ? '' : buscadorHTML('equipo_id', 'Celular *', opsCel, res.equipo_id, 'No hay celulares disponibles que coincidan.', 'Solo celulares activos y sin resguardo.')}
  </div>
  <label class="opcion"><input type="checkbox" data-r="incluirTodos" ${res.incluirTodos ? 'checked' : ''}>
    <span>Mostrar también los que no tienen resguardo aunque estén marcados como asignados o sin definir
      <small>Úsalo para registrar los resguardos de asignaciones que ya existían antes del sistema.</small></span></label>`;

  if (cel || lin) {
    html += `<dl class="compra-cab" style="margin-top:.6rem">
      ${lin ? `<div><dt>Línea</dt><dd class="mono">${esc(lin.telefono)}</dd></div><div><dt>Plan</dt><dd>${esc(lin.plan || '—')}</dd></div>` : ''}
      ${cel ? `<div><dt>Celular</dt><dd>${esc(celularTexto(cel))}</dd></div><div><dt>IMEI</dt><dd class="mono">${esc(cel.imei || '—')}</dd></div>
      <div><dt>Costo con IVA</dt><dd>${fmtMoneda(cel.costo_con_iva)}</dd></div><div><dt>Precio empleado</dt><dd>${fmtMoneda(cel.precio_empleado)}</dd></div>` : ''}
    </dl>`;
  }

  html += `<div class="rejilla" style="margin-top:1rem">
    ${rTxt('fecha_entrega', 'Fecha de entrega *', 'type="date"')}
    ${rTxt('plazo_meses', 'Plazo / vida útil (meses) *', 'type="number" min="1" step="1" list="plazosRes"')}
    <div class="campo"><span class="etq">Renovación</span><strong data-calc="ren" style="padding:.55rem 0">${fmtFecha(ren) || '—'}</strong></div>
    ${cel ? `<label class="campo"><span class="etq">El celular se entrega</span><select data-r="equipo_nuevo">
      <option value="1" ${res.equipo_nuevo ? 'selected' : ''}>Nuevo</option><option value="0" ${!res.equipo_nuevo ? 'selected' : ''}>Usado</option></select></label>` : ''}
  </div><datalist id="plazosRes"><option value="12"><option value="18"><option value="24"></datalist>`;

  if (res.tipo === 'DIFERENCIA') {
    const porPago = aNum(res.parcialidades) ? aNum(res.monto_diferencia) / aNum(res.parcialidades) : 0;
    html += `<h3 class="sub">Pago del colaborador</h3><div class="rejilla">
      ${rTxt('monto_diferencia', 'Monto que paga (precio empleado) *', 'type="number" min="0" step="0.01"')}
      ${rTxt('parcialidades', 'Parcialidades vía nómina *', 'type="number" min="1" step="1"')}
      <div class="campo"><span class="etq">Descuento por parcialidad</span><strong data-calc="porPago" style="padding:.55rem 0">${porPago ? fmtMoneda(porPago) : '—'}</strong></div>
      ${rTxt('valor_equipo', 'Valor total del equipo (cláusulas 3 y 4)', 'type="number" min="0" step="0.01"')}
    </div>`;
  }
  html += `<h3 class="sub">Lo que se entrega</h3><div class="rejilla">
    ${soloLinea ? rTxt('equipo_personal', 'Equipo en el que se usará el chip', 'placeholder="Ej. iPhone 13 personal"') : `${rTxt('color', 'Color')}
    ${rArea('accesorios', 'Accesorios', 'Cargador, cable, funda…')}`}
    ${res.tipo === 'MONITOREADO' ? `${rTxt('valor_equipo', 'Costo / valor de referencia', 'type="number" min="0" step="0.01"')}
      ${rTxt('estado_fisico', 'Estado físico')}${rTxt('estado_funcional', 'Estado funcional')}
      ${rArea('danos_preexistentes', 'Daños o condiciones preexistentes')}` : ''}
    ${rTxt('entrega_nombre', 'Entrega')}
    ${rArea('observaciones', 'Observaciones')}
  </div>`;
  if (res.tipo === 'MONITOREADO') html += `<label class="opcion" style="margin-top:.75rem"><input type="checkbox" data-r="acepta_monitoreo" ${res.acepta_monitoreo ? 'checked' : ''}>
    <span><strong>El colaborador acepta la administración y el monitoreo del equipo</strong>
      <small>Es obligatorio en este tipo. La cláusula completa va en el documento para su firma.</small></span></label>`;

  cuerpo.innerHTML = html;
  cuerpo.parentElement.scrollTop = errores.length ? 0 : scroll;
  iniciarBuscadores();
}

function alElegirEnResguardo(k, valor) {
  res[k] = valor;
  if (k === 'equipo_id') {
    const e = (datos.equipos || []).find(x => String(x.id) === String(valor));
    if (e) {
      const modelo = aux.modelos.find(m => m.id === e.modelo_id);
      const vida = modelo?.vida_util_meses || tipoPorId(e.tipo_id)?.vida_util_meses;
      if (vida) res.plazo_meses = String(vida);
      res.valor_equipo = e.costo_con_iva ?? '';
      res.monto_diferencia = e.precio_empleado ?? '';
      res.equipo_nuevo = !(datos.resguardos || []).some(r => r.equipo_id === e.id);
    }
  }
  pintarResguardo();
}

function validarResguardo() {
  const e = [];
  if (!res.colaborador_id) e.push('Elige al colaborador.');
  if (res.tipo === 'LINEA' && !res.linea_id) e.push('Elige la línea que se entrega.');
  if (res.tipo === 'NORMAL' && !res.equipo_id) e.push('Elige el celular. Si solo entregas el chip, usa el tipo "Solo línea".');
  if (res.tipo === 'MONITOREADO') {
    if (!res.linea_id || !res.equipo_id) e.push('El resguardo monitoreado requiere línea y celular.');
    if (!res.acepta_monitoreo) e.push('Marca que el colaborador acepta el monitoreo.');
  }
  if (res.tipo === 'DIFERENCIA') {
    if (!res.equipo_id) e.push('El resguardo con diferencia requiere un celular.');
    if (!(aNum(res.monto_diferencia) > 0)) e.push('Indica el monto que paga el colaborador.');
    if (!esEntero(res.parcialidades)) e.push('Indica en cuántas parcialidades se descuenta.');
  }
  if (!res.fecha_entrega) e.push('Indica la fecha de entrega.');
  if (!esEntero(res.plazo_meses)) e.push('Indica el plazo en meses.');
  return e;
}

async function guardarResguardo() {
  const err = validarResguardo();
  if (err.length) { pintarResguardo(err); return; }
  const num = v => v === '' || v == null ? null : aNum(v);
  const p = {
    tipo: res.tipo, colaborador_id: Number(res.colaborador_id),
    linea_id: res.linea_id ? Number(res.linea_id) : null, equipo_id: res.equipo_id && res.tipo !== 'LINEA' ? Number(res.equipo_id) : null,
    fecha_entrega: res.fecha_entrega, plazo_meses: Number(res.plazo_meses), equipo_nuevo: !!res.equipo_nuevo,
    color: res.color || null, accesorios: res.accesorios || null, estado_fisico: res.estado_fisico || null,
    estado_funcional: res.estado_funcional || null, danos_preexistentes: res.danos_preexistentes || null,
    valor_equipo: num(res.valor_equipo), entrega_nombre: res.entrega_nombre || null, observaciones: res.observaciones || null,
    monto_diferencia: res.tipo === 'DIFERENCIA' ? num(res.monto_diferencia) : null,
    parcialidades: res.tipo === 'DIFERENCIA' ? num(res.parcialidades) : null,
    acepta_monitoreo: res.tipo === 'MONITOREADO' && !!res.acepta_monitoreo,
    equipo_personal: res.tipo === 'LINEA' ? (res.equipo_personal || null) : null,
  };
  const btn = $('btnGuardar');
  btn.disabled = true; btn.textContent = 'Guardando…';
  const { data, error } = await sb.from('resguardos').insert(p).select('id').single();
  btn.disabled = false; btn.textContent = 'Guardar resguardo';
  if (error) { toast(traducirError(error), true); return; }
  toast(`Resguardo ${folioRes(data.id)} registrado.`);
  await Promise.all([cargar('resguardos'), cargar('lineas'), cargar('equipos')]);
  mostrar(actual);
  const nuevo = (datos.resguardos || []).find(r => r.id === data.id);
  if (nuevo) verResguardo(nuevo); else cerrarPanel();
}

/* ---------- Consulta, impresión, devolución y transferencia ---------- */
let resVista = null;

function verResguardo(r, accion = '') {
  modoPanel = 'verResguardo';
  resVista = r;
  const colab = (datos.colaboradores || []).find(c => c.id === r.colaborador_id);
  const v = vigencia(r);
  $('panel').classList.add('ancho');
  $('panelTitulo').textContent = `Resguardo ${folioRes(r.id)}`;
  $('btnGuardar').hidden = true;
  $('btnCancelar').textContent = 'Cerrar';
  let html = `<dl class="compra-cab">
    <div><dt>Tipo</dt><dd>${esc(TIPOS_RESGUARDO[r.tipo].t)}</dd></div>
    <div><dt>Estatus</dt><dd>${esc(ESTATUS_RESGUARDO[r.estatus])}${r.estatus === 'VIGENTE' ? ` · <span class="chip${v.chip === 'alerta' ? ' chip-alerta' : ' chip-ok'}">${esc(v.t)}</span>` : ''}</dd></div>
    <div><dt>Colaborador</dt><dd>${esc(nombreDe(colab))}</dd></div>
    <div><dt>Línea</dt><dd class="mono">${esc(r.lineas?.telefono || '—')}</dd></div>
    <div><dt>Celular</dt><dd>${esc(celularTexto(r.equipos) || '—')}${r.equipos?.imei ? ` <span class="mono">${esc(r.equipos.imei)}</span>` : ''}</dd></div>
    <div><dt>Entrega</dt><dd>${fmtFecha(r.fecha_entrega)}</dd></div>
    <div><dt>Plazo</dt><dd>${r.plazo_meses} meses</dd></div>
    <div><dt>Renovación</dt><dd>${fmtFecha(r.fecha_renovacion)}</dd></div>
    ${r.tipo === 'DIFERENCIA' ? `<div><dt>Paga el colaborador</dt><dd>${fmtMoneda(r.monto_diferencia)} en ${r.parcialidades} parcialidades</dd></div>` : ''}
    ${r.estatus !== 'VIGENTE' ? `<div><dt>Cierre</dt><dd>${fmtFecha(r.fecha_cierre)}${r.comentario_cierre ? ` · ${esc(r.comentario_cierre)}` : ''}</dd></div>` : ''}
  </dl>
  <div class="acciones" style="margin-bottom:1rem">
    <button type="button" class="btn" data-res="imprimir">Imprimir resguardo</button>
    ${r.estatus === 'VIGENTE' && puedeEscribir(CATALOGOS.resguardos) ? `
      <button type="button" class="btn btn-sec" data-res="devolucion">Registrar devolución</button>
      ${r.tipo === 'DIFERENCIA' ? '<button type="button" class="btn btn-sec" data-res="transferir">Transferir al colaborador</button>' : ''}
      <button type="button" class="btn btn-sec" data-res="cancelar">Cancelar resguardo</button>` : ''}
  </div>`;
  if (accion === 'devolucion') html += `<h3 class="sub">Devolución</h3><div class="rejilla">
      <label class="campo"><span class="etq">Fecha de devolución *</span><input type="date" id="rvFecha" value="${hoyISO()}"></label>
      <label class="campo"><span class="etq">Estado en que regresa</span><input type="text" id="rvEstado" placeholder="Ej. Buen estado, con cargador"></label>
      <label class="campo"><span class="etq">Comentario</span><textarea id="rvComentario"></textarea></label>
    </div><p class="nota">La línea y el celular quedarán disponibles.</p>
    <button type="button" class="btn" data-res="confirmarDevolucion">Confirmar devolución</button>`;
  if (accion === 'transferir') {
    const d = diasHasta(r.fecha_renovacion);
    html += `<h3 class="sub">Transferir el celular al colaborador</h3>
    ${d > 0 ? `<div class="aviso">El plazo termina el ${fmtFecha(r.fecha_renovacion)} (faltan ${d} días). Transfiere antes solo si ya se cubrió el pago.</div>` : ''}
    <div class="rejilla">
      <label class="campo"><span class="etq">Fecha *</span><input type="date" id="rvFecha" value="${hoyISO()}"></label>
      <label class="campo"><span class="etq">Comentario</span><textarea id="rvComentario"></textarea></label>
    </div>
    ${r.linea_id ? `<label class="opcion"><input type="checkbox" id="rvConservar" checked>
      <span>La línea ${esc(r.lineas?.telefono || '')} sigue asignada al colaborador<small>Se crea un resguardo normal nuevo solo con la línea. Si lo desmarcas, la línea queda disponible.</small></span></label>` : ''}
    <p class="nota">El celular se dará de baja del inventario con el motivo "Venta a empleado".</p>
    <button type="button" class="btn" data-res="confirmarTransferencia">Confirmar transferencia</button>`;
  }
  if (accion === 'cancelar') html += `<h3 class="sub">Cancelar resguardo</h3>
    <p class="paso">Úsalo solo si el resguardo se capturó por error. La línea y el celular quedarán disponibles.</p>
    <label class="campo"><span class="etq">Motivo *</span><textarea id="rvComentario"></textarea></label>
    <button type="button" class="btn" data-res="confirmarCancelacion">Confirmar cancelación</button>`;
  $('panelCampos').innerHTML = html;
  if (!$('panel').open) $('panel').showModal();
}

async function cerrarResguardo(cambios) {
  const { error } = await sb.from('resguardos').update(cambios).eq('id', resVista.id);
  if (error) { toast(traducirError(error), true); return false; }
  return true;
}
async function recargarResguardos(id) {
  await Promise.all([cargar('resguardos'), cargar('lineas'), cargar('equipos')]);
  mostrar(actual);
  const r = (datos.resguardos || []).find(x => x.id === id);
  if (r) verResguardo(r);
}

$('panelCampos').addEventListener('click', async e => {
  const b = e.target.closest('[data-res]');
  if (!b || modoPanel !== 'verResguardo') return;
  const r = resVista, accion = b.dataset.res;
  if (accion === 'imprimir') return imprimirResguardo(r);
  if (['devolucion', 'transferir', 'cancelar'].includes(accion)) return verResguardo(r, accion);
  const fecha = $('rvFecha')?.value, comentario = $('rvComentario')?.value.trim() || null;
  if (accion === 'confirmarDevolucion') {
    if (!fecha) return toast('Indica la fecha de devolución.', true);
    if (await cerrarResguardo({ estatus: 'DEVUELTO', fecha_cierre: fecha, estado_devolucion: $('rvEstado').value.trim() || null, comentario_cierre: comentario })) {
      toast(r.linea_id && r.equipo_id ? 'Devolución registrada; la línea y el celular quedaron disponibles.'
        : `Devolución registrada; ${r.linea_id ? 'la línea quedó disponible' : 'el celular quedó disponible'}.`);
      recargarResguardos(r.id);
    }
  }
  if (accion === 'confirmarCancelacion') {
    if (!comentario) return toast('Indica el motivo de la cancelación.', true);
    if (await cerrarResguardo({ estatus: 'CANCELADO', fecha_cierre: hoyISO(), comentario_cierre: comentario })) {
      toast('Resguardo cancelado.'); recargarResguardos(r.id);
    }
  }
  if (accion === 'confirmarTransferencia') {
    if (!fecha) return toast('Indica la fecha.', true);
    const { data, error } = await sb.rpc('transferir_resguardo', { p_id: r.id, p_fecha: fecha, p_conservar_linea: !!$('rvConservar')?.checked, p_comentario: comentario });
    if (error) return toast(traducirError(error), true);
    toast(data.nuevo_resguardo ? `Celular transferido. La línea continúa en el resguardo ${folioRes(data.nuevo_resguardo)}.` : 'Celular transferido al colaborador.');
    await Promise.all([cargar('resguardos'), cargar('lineas'), cargar('equipos')]);
    mostrar(actual);
    const nuevo = data.nuevo_resguardo && (datos.resguardos || []).find(x => x.id === data.nuevo_resguardo);
    if (nuevo) verResguardo(nuevo); else recargarResguardos(r.id);
  }
});

// Captura del formulario de alta
$('panelCampos').addEventListener('input', e => {
  if (modoPanel !== 'resguardo' || !res) return;
  const el = e.target, k = el.dataset.r;
  if (!k || el.type === 'checkbox' || el.type === 'radio' || el.tagName === 'SELECT' || el.type === 'hidden') return;
  res[k] = el.value;
  const ren = $('panelCampos').querySelector('[data-calc="ren"]');
  if (ren) ren.textContent = fmtFecha(sumarMeses(res.fecha_entrega, res.plazo_meses)) || '—';
  const pp = $('panelCampos').querySelector('[data-calc="porPago"]');
  if (pp) pp.textContent = aNum(res.parcialidades) ? fmtMoneda(aNum(res.monto_diferencia) / aNum(res.parcialidades)) : '—';
});
$('panelCampos').addEventListener('change', e => {
  if (modoPanel !== 'resguardo' || !res) return;
  const el = e.target, k = el.dataset.r;
  if (!k) return;
  if (el.type === 'hidden') return alElegirEnResguardo(k, el.value);
  if (el.type === 'checkbox') res[k] = el.checked;
  else if (el.type === 'radio') { res[k] = el.value; if (k === 'tipo' && el.value === 'LINEA') res.equipo_id = ''; }
  else if (k === 'equipo_nuevo') res[k] = el.value === '1';
  else return;
  if (k === 'incluirTodos' && !el.checked) {
    if (res.linea_id && !lineasDisponibles().some(l => String(l.id) === String(res.linea_id))) res.linea_id = '';
    if (res.equipo_id && !celularesDisponibles().some(x => String(x.id) === String(res.equipo_id))) res.equipo_id = '';
  }
  pintarResguardo();

function imprimirResguardo(r) {
  const colab = (datos.colaboradores || []).find(c => c.id === r.colaborador_id) || {};
  const jefe = colab.jefe_id ? aux.colaboradores.find(x => x.id === colab.jefe_id) : null;
  const e = r.equipos || {};
  const lin = r.lineas || {};
  const nombre = nombreDe(colab).toUpperCase();
  const area = [colab.area, colab.centros_costo?.nombre].filter(Boolean).join(' / ');
  const nuevoUsado = r.equipo_nuevo ? 'nuevo' : 'usado';
  const v = x => esc(x || '');
  const encabezadoLogos = `<div class="logos"><img src="${LOGOS.car}" alt=""><img src="${LOGOS.deposito}" alt=""><img src="${LOGOS.tubos}" alt=""><img src="${LOGOS.construcasa}" alt=""></div>`;
  let cuerpo = '';

  if (r.tipo === 'NORMAL') {
    cuerpo = `${encabezadoLogos}<div class="banda">${EMPRESA.razonCorta}</div>
      <h1>RESGUARDO DE EQUIPO CELULAR</h1>
      <p>RECIBÍ ${r.equipo_id ? `DISPOSITIVO MOVIL ${nuevoUsado.toUpperCase()}` : 'LÍNEA TELEFÓNICA'}, PARA USO EN FUNCIONES LABORALES, EL CUAL SE DETALLA A CONTINUACIÓN:</p>
      <p class="dato"><b>MARCA:</b> ${v(e.marcas?.nombre || (r.equipo_id ? '' : 'N/A'))}</p>
      <p class="dato"><b>MODELO:</b> ${v(e.modelos?.nombre || e.descripcion || (r.equipo_id ? '' : 'N/A'))}</p>
      <p class="dato"><b>COLOR:</b> ${v(r.color || (r.equipo_id ? '' : 'N/A'))}</p>
      <p class="dato"><b>IMEI:</b> ${v(e.imei || (r.equipo_id ? '' : 'N/A'))}</p>
      <p class="dato" style="margin-top:1.2em"><b>NUMERO ASIGNADO: ${v(lin.telefono || 'N/A')}</b></p>
      <p class="dato" style="margin-top:1.2em"><b>ACCESORIOS:</b> ${v(r.accesorios)}</p>
      <div class="recuadro">COMPROMETIENDOME A DARLES UN BUEN USO, ADECUADO Y A DEVOLVERLOS CUANDO LA EMPRESA <b>${EMPRESA.razonCorta}</b> LO REQUIERA, AL MISMO TIEMPO FACULTO A LA EMPRESA A DESCONTAR DE MIS PERCEPCIONES EL IMPORTE DEL MISMO, EN CASO DE EXTRAVÍO O DESCOMPOSTURA POR MAL USO, O MALTRATO.</div>
      <p class="derecha">${EMPRESA.lugar} ${fechaLarga(r.fecha_entrega)}</p>
      <table class="firmas"><tr><td>RECIBIO<div class="linea"></div>${v(nombre)}</td><td>ENTREGÓ<div class="linea"></div>${v((r.entrega_nombre || '').toUpperCase())}</td></tr></table>
      ${r.observaciones ? `<p class="obs"><b>Observaciones:</b> ${v(r.observaciones)}</p>` : ''}`;
  }

  if (r.tipo === 'DIFERENCIA') {
    const parc = r.parcialidades;
    cuerpo = `${encabezadoLogos}
      <h1>RESGUARDO DE EQUIPO MÓVIL</h1>
      <p class="dato"><b>DATOS DEL RESGUARDANTE:</b></p>
      <p class="dato"><b>NOMBRE:</b> ${v(nombre)}</p>
      <p class="dato"><b>PUESTO:</b> ${v(colab.puesto)}</p>
      <p class="dato"><b>DEPARTAMENTO/ÁREA:</b> ${v(area)}</p>
      <p class="dato"><b>NUMERO TELEFONICO ASIGNADO:</b> ${v(lin.telefono || 'N/A')}</p>
      <p class="dato"><b>FECHA DE ENTREGA:</b> ${fmtFecha(r.fecha_entrega)}</p>
      <p class="dato" style="margin-top:1em"><b>CARACTERISTICAS DEL EQUIPO:</b></p>
      <p class="dato"><b>MARCA Y MODELO:</b> ${v([e.marcas?.nombre, e.modelos?.nombre || e.descripcion].filter(Boolean).join(' '))}</p>
      <p class="dato"><b>IMEI:</b> ${v(e.imei)}</p>
      <p class="just">${EMPRESA.razon} (La Empresa) hace entrega a C: ${v(nombre)} (El Colaborador), un teléfono celular ${nuevoUsado} para uso en funciones laborales;</p>
      <p>Bajo las siguientes Condiciones:</p>
      <ol class="just">
        <li>El colaborador dejará un depósito de $${montoTexto(r.monto_diferencia)} (${pesosEnLetra(r.monto_diferencia)}) el cual se descontará vía nómina en ${parc} (${numeroALetras(parc).toLowerCase()}) parcialidades, con el fin de que una vez terminado el plazo del plan de ${r.plazo_meses} meses con la compañía telefónica, el equipo pase a ser propiedad de El Colaborador.</li>
        <li>El Colaborador se compromete a devolver el equipo celular cuando La Empresa se lo requiera, y La Empresa se compromete a devolver a El Colaborador el depósito mencionado en la condición número uno, siempre y cuando no sea responsabilidad de El Colaborador la causa que origine dicha requisición, que el teléfono esté en óptimas condiciones, con todos los accesorios en buen estado y el plazo del plan siga vigente.</li>
        <li>Si la relación laboral termina, El Colaborador está obligado a devolver el equipo, si El Colaborador decide adquirir el equipo o no devolverlo, tendrá que pagar el importe total del equipo por la cantidad de $${montoTexto(r.valor_equipo)} (${pesosEnLetra(r.valor_equipo)}), para que La Empresa pueda adquirir uno nuevo.</li>
        <li>Durante el plazo mencionado en la condición número 1, si el equipo se encuentra en malas condiciones, sea extraviado o tenga algún daño irreparable, por causas imputables a El Colaborador, éste se compromete a pagar el importe total del equipo por la cantidad de $${montoTexto(r.valor_equipo)} (${pesosEnLetra(r.valor_equipo)}) para que La Empresa pueda reponer el equipo. El equipo que se repondrá será el equipo básico y si desea un equipo de mejores especificaciones deberá pagar el depósito correspondiente.</li>
        <li>Si El Colaborador es víctima de un asalto o robo dentro del centro de trabajo, durante el horario de actividades laborales; La Empresa repondrá el equipo sin cargo al colaborador. Este será un equipo básico en caso de que El Colaborador desee un equipo de mejores especificaciones deberá pagar el depósito correspondiente.</li>
        <li>El equipo adquirido es para funciones laborales, por tal motivo no puede ser reemplazado por un equipo de menor categoría, si el colaborador llega a reemplazar el equipo antes del plazo y éste no funciona para las actividades propias de la empresa, La empresa descontará el monto Total y sin descuentos el valor del equipo</li>
        <li>La Empresa no devolverá el depósito especificado en la condición número uno, si las condiciones número tres, cuatro, cinco o seis son aplicables.</li>
      </ol>
      <table class="firmas"><tr><td>EMPRESA<div class="linea"></div>${EMPRESA.representante}<br>REPRESENTANTE LEGAL</td>
        <td>ESTOY CONFORME Y RECIBO<div class="linea"></div>C. ${v(nombre)}<br>COLABORADOR</td></tr>
        <tr><td colspan="2" class="testigos">TESTIGOS</td></tr>
        <tr><td><div class="linea"></div>${EMPRESA.testigo}</td><td><div class="linea"></div>C. ${v(jefe ? nombreDe(jefe).toUpperCase() : '')}</td></tr></table>
      <p class="obs"><b>Observaciones:</b> ${v(r.observaciones) || '<span class="raya"></span>'}</p>`;
  }

  if (r.tipo === 'LINEA') {
    const fila = (c, d) => `<tr><td>${c}</td><td>${d}</td></tr>`;
    cuerpo = `${encabezadoLogos}<div class="banda">${EMPRESA.razonCorta}</div>
      <h1 style="margin-bottom:0">RESGUARDO DE LÍNEA TELEFÓNICA</h1>
      <p class="centro" style="margin-bottom:12px">(CHIP / TARJETA SIM)</p>
      <h2>DATOS DEL COLABORADOR</h2>
      <p class="dato">Nombre: <u>${v(nombreDe(colab))}</u> &nbsp;&nbsp; Número de empleado: <u>${v(colab.num_empleado)}</u></p>
      <p class="dato">Puesto: <u>${v(colab.puesto)}</u> &nbsp;&nbsp; Área / Sucursal: <u>${v(area)}</u></p>
      <p class="dato">Fecha de entrega: <u>${fechaLarga(r.fecha_entrega)}</u></p>
      <h2>DATOS DE LA LÍNEA ASIGNADA</h2>
      <table class="tabla"><thead><tr><th>Concepto</th><th>Descripción</th></tr></thead><tbody>
        ${fila('Número telefónico', v(lin.telefono))}${fila('Compañía', v(lin.operador || 'TELCEL'))}${fila('Plan', v(lin.plan))}
        ${fila('ICCID (número del chip)', v(lin.iccid))}${fila('Tipo de SIM', lin.esim ? 'eSIM' : 'Física')}
        ${fila('Equipo en el que se usará', v(r.equipo_personal))}
      </tbody></table>
      <h2>DECLARACIÓN DE RECEPCIÓN</h2>
      <p class="just">Por medio del presente, hago constar que recibí de CAR Comercializadora, S.A. de C.V. la línea telefónica y el chip (tarjeta SIM) anteriormente descritos, para utilizarlos como herramienta de trabajo en el desempeño de mis funciones laborales.</p>

let toastTimer;
function toast(msg, esError = false) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.toggle('error', esError);
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.hidden = true), esError ? 6000 : 3000);
}

   9. ARRANQUE
   ========================================================= */
(async function init() {
  if (!configurado) {
    mostrarLogin('Falta configurar la conexión: abre index.html y pega tu Project URL y anon key de Supabase en la sección 1 del script.');
    $('btnEntrar').disabled = true;
    return;
  }
  sb.auth.onAuthStateChange(async (evento) => {
    if (evento === 'PASSWORD_RECOVERY') {
      const nueva = prompt('Escribe tu nueva contraseña (mínimo 8 caracteres):');
      if (nueva && nueva.length >= 8) {
        const { error } = await sb.auth.updateUser({ password: nueva });
        toast(error ? 'No se pudo cambiar la contraseña.' : 'Contraseña actualizada.', !!error);
      }
    }
  });
  const { data: { session } } = await sb.auth.getSession();
  if (session) await entrar(session); else mostrarLogin();
})();
</script>
