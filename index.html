        <textarea data-a="series" placeholder="Una serie por renglón">${esc(a.series)}</textarea></label>
      ${t.requiere_imei ? `<label class="campo"><span class="etq">IMEI</span><textarea data-a="imeis">${esc(a.imeis)}</textarea></label>` : ''}
    </div>
    <label class="opcion"><input type="checkbox" data-a="despues" ${a.despues ? 'checked' : ''}> <span>Capturar series después</span></label>` : ''}
    <div class="totales">
      <div><span>Costo de cada equipo sin IVA</span><strong data-calc="a-sin"></strong></div>
      <div><span>Costo de cada equipo con IVA</span><strong data-calc="a-con"></strong></div>
    </div>`;
  }
  return html;
}

function construirPayload() {
  const k = compra, a = k.armar;
  const centro = c => Number(c.centro_costo_id || k.centro_costo_id);
  const equipos = [];
  k.conceptos.forEach(c => {
    const base = {
      tipo_id: Number(c.tipo_id), marca_id: c.marca_id || null, modelo_id: c.modelo_id || null,
      descripcion: c.descripcion, centro_costo_id: centro(c),
      costo_sin_iva: r2(c.unitSin), costo_con_iva: r2(c.unitCon),
    };
    if (c.rol === 'EQUIPO') {
      const t = tipoPorId(c.tipo_id);
      base.precio_empleado = c.precio_empleado === '' ? null : aNum(c.precio_empleado);
      if (t?.requiere_serie) {
        const s = renglones(c.series), im = renglones(c.imeis);
        for (let j = 0; j < aNum(c.cantidad); j++)
          equipos.push({ ...base, cantidad: 1, num_serie: s[j] || null, imei: t.requiere_imei ? (im[j] || null) : null });
      } else equipos.push({ ...base, cantidad: aNum(c.cantidad) });
    } else if (c.rol === 'MATERIAL') {
      const sobra = aNum(c.cantidad) - (a.si ? aNum(a.n) * aNum(a.por[c.i]) : 0);
      if (sobra > 0) equipos.push({ ...base, cantidad: sobra, es_material: true });
    }
  });
  const armados = [];
  if (a.si) {
    const t = tipoPorId(a.tipo_id);
    const s = renglones(a.series), im = renglones(a.imeis);
    const componentes = k.conceptos.filter(c => c.rol === 'MATERIAL' && aNum(a.por[c.i]) > 0).map(c => ({
      descripcion: c.descripcion, tipo_id: c.tipo_id || null, marca_id: c.marca_id || null, cantidad: aNum(a.por[c.i]),
      costo_unit_sin_iva: Math.round(c.unitSin * 10000) / 10000, costo_unit_con_iva: Math.round(c.unitCon * 10000) / 10000,
    }));
    for (let j = 0; j < aNum(a.n); j++) armados.push({
      tipo_id: Number(a.tipo_id), marca_id: a.marca_id || null, modelo_id: a.modelo_id || null,
      descripcion: a.descripcion || `${t?.nombre || 'Equipo'} armado`,
      num_serie: t?.requiere_serie ? (s[j] || null) : null, imei: t?.requiere_imei ? (im[j] || null) : null,
      centro_costo_id: Number(a.centro_costo_id || k.centro_costo_id),
      costo_sin_iva: r2(a.costoSin), costo_con_iva: r2(a.costoCon),
      precio_empleado: a.precio_empleado === '' ? null : aNum(a.precio_empleado), componentes,
    });
  }
  return {
    origen: k.origen, proveedor_id: k.proveedor_id || null, proveedor: k.proveedor || null,
    folio: k.folio, uuid: k.uuid || null, fecha: k.fecha, moneda: k.moneda, tipo_cambio: k.tipo_cambio,
    subtotal: r2(k.subtotal), descuento: r2(k.descuento || 0), iva: r2(k.iva), total: r2(k.total), envio: r2(k.calc.envioSin),
    xml: k.xml || null, archivo: k.archivo || null, equipos, armados,
  };
}

function pasoResumen() {
  const p = construirPayload();
  const conSerie = p.equipos.filter(e => !e.es_material && e.cantidad === 1 && tipoPorId(e.tipo_id)?.requiere_serie).length;
  const porCant = p.equipos.filter(e => !e.es_material && !tipoPorId(e.tipo_id)?.requiere_serie);
  const mats = p.equipos.filter(e => e.es_material);
  const sinSerie = p.equipos.filter(e => tipoPorId(e.tipo_id)?.requiere_serie && !e.num_serie).length
    + p.armados.filter(e => tipoPorId(e.tipo_id)?.requiere_serie && !e.num_serie).length;
  const valor = [...p.equipos.map(e => e.costo_sin_iva * e.cantidad), ...p.armados.map(e => e.costo_sin_iva)].reduce((s, v) => s + v, 0);
  const valorCon = [...p.equipos.map(e => e.costo_con_iva * e.cantidad), ...p.armados.map(e => e.costo_con_iva)].reduce((s, v) => s + v, 0);
  return cabeceraCompraResumen() + `
    <div class="cifras">
      <div><strong>${conSerie}</strong><span>equipos con serie</span></div>
      <div><strong>${porCant.reduce((s, e) => s + e.cantidad, 0)}</strong><span>piezas por cantidad (${porCant.length} renglones)</span></div>
      <div><strong>${p.armados.length}</strong><span>equipos armados</span></div>
      <div><strong>${mats.reduce((s, e) => s + e.cantidad, 0)}</strong><span>materiales sobrantes a stock</span></div>
    </div>
    <div class="totales" style="margin-bottom:1rem">
      <div><span>Valor registrado sin IVA</span><strong>${fmtMoneda(valor)}</strong></div>
      <div><span>Valor registrado con IVA</span><strong>${fmtMoneda(valorCon)}</strong></div>
      <div><span>Envío repartido</span><strong>${fmtMoneda(p.envio)}</strong></div>
    </div>
    ${sinSerie ? `<p class="nota">${sinSerie} equipo(s) quedarán sin número de serie para capturarlo después.</p>` : ''}
    <p class="paso">Al guardar se registra todo junto. Si algo falla, no se guarda nada.</p>`;
}
function cabeceraCompraResumen() {
  const k = compra;
  const prov = k.origen === 'XML' ? (k.proveedor.razon_social || k.proveedorNombre) : (aux.proveedores.find(p => String(p.id) === String(k.proveedor_id))?.razon_social || '');
  return `<dl class="compra-cab">
    <div><dt>Proveedor</dt><dd>${esc(prov)}</dd></div>
    <div><dt>${k.origen === 'XML' ? 'Folio' : 'Remisión'}</dt><dd class="mono">${esc(k.folio || 's/f')}</dd></div>
    <div><dt>Fecha</dt><dd>${fmtFecha(k.fecha)}</dd></div>
    <div><dt>Total del documento</dt><dd>${fmtMoneda(k.total)}</dd></div>
  </dl>`;
}

function pintarCalculosCompra() {
  if (modoPanel !== 'compra' || !compra || pasoCompra < 2) return;
  calcularCompra();
  const set = (k, v) => { const el = $('panelCampos').querySelector(`[data-calc="${k}"]`); if (el) el.textContent = v; };
  compra.conceptos.forEach(c => {
    if (c.unitSin != null) set(`costo-${c.i}`, `Costo unitario: ${fmtMoneda(c.unitSin)} sin IVA · ${fmtMoneda(c.unitCon)} con IVA` +
      (c.parteEnvio ? ` (incluye ${fmtMoneda(c.parteEnvio / (aNum(c.cantidad) || 1))} de envío por pieza)` : ''));
    set(`nser-${c.i}`, `(${renglones(c.series).length} de ${aNum(c.cantidad)})`);
    set(`nimei-${c.i}`, `(${renglones(c.imeis).length} de ${aNum(c.cantidad)})`);
    const usa = compra.armar.si ? aNum(compra.armar.n) * aNum(compra.armar.por[c.i]) : 0;
    set(`usa-${c.i}`, usa);
    set(`sobra-${c.i}`, aNum(c.cantidad) - usa);
  });
  set('t-envio', fmtMoneda(compra.calc.envioSin));
  set('t-sin', fmtMoneda(compra.calc.totSin));
  set('t-con', fmtMoneda(compra.calc.totCon));
  set('t-omit', fmtMoneda(compra.calc.omitido));
  set('a-sin', fmtMoneda(compra.armar.costoSin));
  set('a-con', fmtMoneda(compra.armar.costoCon));
  set('aser', `(${renglones(compra.armar.series).length} de ${aNum(compra.armar.n)})`);
}

function validarPaso() {
  const k = compra, err = [];
  if (pasoCompra === 2) {
    if (!k.centro_costo_id) err.push('Elige el centro de costo de la compra.');
    if (k.origen === 'REMISION') {
      if (!k.proveedor_id) err.push('Elige el proveedor.');
      if (!k.fecha) err.push('Indica la fecha.');
    }
    const base = k.conceptos.filter(c => c.rol === 'EQUIPO' || c.rol === 'MATERIAL');
    if (!base.length) err.push('Al menos un concepto debe ser equipo, suministro o material.');
    const todasSeries = [], todosImei = [];
    k.conceptos.forEach((c, n) => {
      const nom = `"${(c.descripcion || `Renglón ${n + 1}`).slice(0, 50)}"`;
      if (k.origen === 'REMISION') {
        if (!c.descripcion.trim()) err.push(`Renglón ${n + 1}: falta la descripción.`);
        if (!(aNum(c.cantidad) > 0)) err.push(`${nom}: la cantidad debe ser mayor a cero.`);
        if (c.rol !== 'OMITIR' && !(aNum(c.vu) > 0)) err.push(`${nom}: falta el precio unitario.`);
      }
      if (c.rol !== 'EQUIPO' && c.rol !== 'MATERIAL') return;
      const t = tipoPorId(c.tipo_id);
      if (!t) { err.push(`${nom}: elige el tipo.`); return; }
      if (!esEntero(c.cantidad)) err.push(`${nom}: la cantidad (${c.cantidad}) debe ser un número entero para registrarla en inventario.`);
      if (c.rol === 'EQUIPO' && t.requiere_serie) {
        const s = renglones(c.series), im = renglones(c.imeis);
        if (!c.despues && s.length !== aNum(c.cantidad)) err.push(`${nom}: capturaste ${s.length} series y son ${c.cantidad} piezas.`);
        if (c.despues && s.length > aNum(c.cantidad)) err.push(`${nom}: hay más series (${s.length}) que piezas (${c.cantidad}).`);
        if (t.requiere_imei) {
          if (!c.despues && im.length !== aNum(c.cantidad)) err.push(`${nom}: capturaste ${im.length} IMEI y son ${c.cantidad} piezas.`);
          im.filter(x => !/^\d{15}$/.test(x)).forEach(x => err.push(`${nom}: el IMEI ${x} no tiene 15 dígitos.`));
          todosImei.push(...im);
        }
        todasSeries.push(...s.map(x => x.toUpperCase()));
      }
    });
    const dup = l => [...new Set(l.filter((x, i) => l.indexOf(x) !== i))];
    dup(todasSeries).forEach(x => err.push(`La serie ${x} está repetida en esta compra.`));
    dup(todosImei).forEach(x => err.push(`El IMEI ${x} está repetido en esta compra.`));
    const existentes = new Set((datos.equipos || []).map(e => (e.num_serie || '').toUpperCase()).filter(Boolean));
    todasSeries.filter(x => existentes.has(x)).forEach(x => err.push(`La serie ${x} ya existe en el inventario.`));
  }
  if (pasoCompra === 3) {
    const a = k.armar;
    if (a.si === null) err.push('Indica si deseas armar equipos.');
    if (a.si) {
      if (!esEntero(a.n)) err.push('Indica cuántos equipos vas a armar.');
      const t = tipoPorId(a.tipo_id);
      if (!t) err.push('Elige el tipo de equipo resultante.');
      const mats = k.conceptos.filter(c => c.rol === 'MATERIAL');
      if (!mats.some(c => aNum(a.por[c.i]) > 0)) err.push('Indica qué materiales lleva cada equipo.');
      mats.forEach(c => {
        const p = a.por[c.i];
        if (p !== undefined && p !== '' && !(Number.isInteger(Number(p)) && Number(p) >= 0)) err.push(`"${c.descripcion.slice(0, 50)}": la cantidad por equipo debe ser entera.`);
        else if (aNum(a.n) * aNum(p) > aNum(c.cantidad)) err.push(`"${c.descripcion.slice(0, 50)}": se necesitan ${aNum(a.n) * aNum(p)} y solo hay ${c.cantidad}.`);
      });
      if (t?.requiere_serie && !a.despues && renglones(a.series).length !== aNum(a.n))
        err.push(`Capturaste ${renglones(a.series).length} series para ${a.n} equipos armados.`);
    }
  }
  return err;
}

async function avanzarCompra() {
  if (pasoCompra === 4) { await guardarCompra(); return; }
  const err = validarPaso();
  if (err.length) { pintarCompra(err); return; }
  pasoCompra = pasoCompra === 2 && !hayMateriales() ? 4 : pasoCompra + 1;
  if (pasoCompra === 4 && !hayMateriales()) compra.armar.si = false;
  pintarCompra();
  $('panelCampos').parentElement.scrollTop = 0;
}
function retrocederCompra() {
  pasoCompra = pasoCompra === 4 && !hayMateriales() ? 2 : pasoCompra - 1;
  pintarCompra();
}

async function guardarCompra() {
  const btn = $('btnGuardar');
  btn.disabled = true; btn.textContent = 'Guardando…';
  const { data, error } = await sb.rpc('registrar_compra', { p: construirPayload() });
  btn.disabled = false; btn.textContent = 'Guardar compra';
  if (error) { toast(`No se guardó nada: ${traducirError(error)}`, true); return; }
  toast(`Compra registrada: ${data.equipos} equipo(s), ${data.armados} armado(s), ${data.materiales} material(es) a stock.`);
  cerrarPanel();
  await Promise.all([cargar('equipos'), cargar('compras'), cargar('proveedores'), cargarAux()]);
  mostrar('equipos');
}

// Captura de datos del asistente
$('panelCampos').addEventListener('input', e => {
  if (modoPanel !== 'compra' || !compra) return;
  const el = e.target;
  if (el.type === 'checkbox' || el.type === 'radio' || el.tagName === 'SELECT') return;
  if (el.dataset.c !== undefined) compra.conceptos.find(c => c.i === Number(el.dataset.c))[el.dataset.f] = el.value;
  else if (el.dataset.a === 'por') compra.armar.por[el.dataset.m] = el.value;
  else if (el.dataset.a) compra.armar[el.dataset.a] = el.value;
  else if (el.dataset.g) compra[el.dataset.g] = el.value;
  pintarCalculosCompra();
});
$('panelCampos').addEventListener('change', e => {
  if (modoPanel !== 'compra' || !compra) return;
  const el = e.target;
  if (!(el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'radio')) return;
  const valor = el.type === 'checkbox' ? el.checked : el.type === 'radio' ? el.value === '1' : el.value;
  if (el.dataset.c !== undefined) {
    const c = compra.conceptos.find(x => x.i === Number(el.dataset.c));
    c[el.dataset.f] = valor;
    if (el.dataset.f === 'marca_id' || el.dataset.f === 'tipo_id') {
      if (c.modelo_id && !optModelos(c.marca_id, c.tipo_id).some(([id]) => String(id) === String(c.modelo_id))) c.modelo_id = '';
    }
  } else if (el.dataset.a) {
    compra.armar[el.dataset.a] = valor;
  } else if (el.dataset.g) compra[el.dataset.g] = valor;
  pintarCompra();
});
$('panelCampos').addEventListener('click', e => {
  if (modoPanel !== 'compra' || !compra) return;
  const q = e.target.closest('[data-quitar]'), ag = e.target.closest('[data-agregar]');
  if (q) { compra.conceptos = compra.conceptos.filter(c => c.i !== Number(q.dataset.quitar)); pintarCompra(); }
  if (ag) { compra.conceptos.push(conceptoNuevo(Math.max(...compra.conceptos.map(c => c.i)) + 1, {})); pintarCompra(); }
});
$('btnAtras').addEventListener('click', retrocederCompra);
$('panel').addEventListener('close', () => {
  $('panel').classList.remove('ancho');
  $('btnAtras').hidden = true;
});

/* =========================================================
   8. AVISOS
   ========================================================= */
let toastTimer;
function toast(msg, esError = false) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.toggle('error', esError);
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.hidden = true), esError ? 6000 : 3000);
}

/* =========================================================
   9. ARRANQUE
   ========================================================= */
(async function init() {
  if (!configurado) {
    mostrarLogin('Falta configurar la conexión: abre index.html y pega tu Project URL y anon key de Supabase en la sección 1 del script.');
    $('btnEntrar').disabled = true;
    return;
  }
  sb.auth.onAuthStateChange(async (evento) => {
    if (evento === 'PASSWORD_RECOVERY') {
      const nueva = prompt('Escribe tu nueva contraseña (mínimo 8 caracteres):');
      if (nueva && nueva.length >= 8) {
        const { error } = await sb.auth.updateUser({ password: nueva });
        toast(error ? 'No se pudo cambiar la contraseña.' : 'Contraseña actualizada.', !!error);
      }
    }
  });
  const { data: { session } } = await sb.auth.getSession();
  if (session) await entrar(session); else mostrarLogin();
})();
</script>
